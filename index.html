],["How many paid holiday days must full-time workers receive per year?",["20 days","28 days","5.6 days","30 days"],1,"Most workers get 5.6 weeks of paid holiday, and full-time workers must receive 28 days of paid annual leave.","Problem Sensitivity 1"],["Officer A. Pattyn logged: \"A. Pattyn; 2:36 AM; 0062; Inmate Mr. Jerry Underwood found bleeding from gut area.\" What is the logging error?",["The officer's name should be written in full","The description shouldn't be in the entry","The starting hour is wrong","The description lacks information"],0,"The officer must enter his or her name in full.","Problem Sensitivity 1"],["Under the NSOC rule, how often must Suicide Risk inmates be checked?",["Every 5 minutes","Every hour","Every 15 minutes","Every 30 minutes"],2,"Administrative Segregation and Disciplinary Status inmates are checked every 30 minutes, and Suicide Risk inmates every 15.","Problem Sensitivity 1"],["For a disturbance other than injury, death or an escape attempt, how soon must the Shift Supervisor be notified?",["By the end of the shift","Within half an hour","Within 24 hours","Immediately, by radio"],1,"Other disturbances are briefly noted in the nightly log, and the Shift Supervisor is notified within half an hour.","Problem Sensitivity 1"],["Julie Cecelia Gibbs worked night hours (3:00–5:30 AM), but the lengths of her shifts weren't recorded. What violation is this?",["Excessive personal information was recorded","Work shift times were recorded improperly","The recorded time period doesn't comply","Insufficient personal information was recorded"],1,"For night-time employees, the start time and length of each shift must be recorded.","Problem Sensitivity 1"],["What is the widest bracelet a male correctional employee may wear on duty?",["No bracelet of any kind","A leather bracelet up to 1\"","A golden or gilded bracelet no wider than 3/8\"","Any silver bracelet up to 1/2\""],2,"Males may wear a wristwatch, a ring, and a golden or gilded bracelet no wider than 3/8\".","Problem Sensitivity 1"],["Which medical alert item is acceptable for a uniformed employee?",["A medical alert earring","A medical alert necklace","A medical alert ring","A silver medical alert bracelet"],3,"A necklace or ring is not an acceptable substitute for the bracelet.","Problem Sensitivity 1"],["Under the FOI highlights, how often must each branch update its subject-matter index?",["At least quarterly","At least yearly","Only when a record is removed","At least monthly"],0,"Each branch keeps a current subject-matter index, updated at least quarterly.","Problem Sensitivity 1"],["At the gas-station robbery, witnesses 2–4 saw brass knuckles on the suspect's right hand, while witness 1 reported gloves. Whose description has a problem?",["Witness 1","Witness 2","Witness 3","Witness 4"],0,"Only witness 1 differs, reporting gloves and no brass knuckles.","Problem Sensitivity 2"],["In the hit-and-run, witnesses gave plates WSY2365, WYS2365, \"WSY…\" and \"YYH…\". Whose description has a problem?",["Witness 1","Witness 2","Witness 3","Witness 4"],1,"Witness 2's plate starting with \"YYH\" matches none of the other three.","Problem Sensitivity 2"],["Ryan's four friends gave his alibi for the 11:15 PM train. Friend 1 says Ryan slept the whole trip, but friends 3 and 4 say he ate snacks and read a magazine on the train. Whose account has a problem?",["Friend 1","Friend 2","Friend 3","Friend 4"],0,"Friend 1's sleeping Ryan contradicts the snack-and-magazine accounts. The arrival times all fit 10:45 PM.","Problem Sensitivity 2"],["In the roadside murder, witnesses 1, 3 and 4 describe a white car and witness 2 a dark car. Whose description has a problem?",["Witness 1","Witness 2","Witness 3","Witness 4"],1,"Witness 2 is the only one who describes a dark car.","Problem Sensitivity 2"],["At the shoplifting, witnesses 1–3 say the elderly woman was about five feet or slightly under, and witness 4 says five and a half feet. Whose description has a problem?",["Witness 1","Witness 2","Witness 3","Witness 4"],3,"Witness 4's height is far from the other three.","Problem Sensitivity 2"],["At the theater-parking-lot shooting, witnesses 1, 2 and 4 say the shooter was screaming, and witness 3 says he stood silently. Whose description has a problem?",["Witness 1","Witness 2","Witness 3","Witness 4"],2,"Witness 3 alone describes the shooter as silent.","Problem Sensitivity 2"],["In the confidentiality rule's crime classes, what class is armed theft?",["A.I","B.I","A.II","A.III"],2,"A.II covers armed theft and theft of over $1 million. A.I is murder and rape.","Problem Sensitivity 2"],["Which crime is class B.II?",["Sexual harassment","Breaking and entering","Graffiti writing","Speeding"],1,"B.II is breaking and entering. C is sexual harassment, D.I graffiti, and D.II speeding.","Problem Sensitivity 2"],["What must follow any disclosure of classified case information?",["A note in the nightly log","A verbal briefing to the Chief","A CGR 155 form","A full UL-177 report"],3,"Any disclosure of classified information must be followed by a full UL-177 report.","Problem Sensitivity 2"],["Under the absence rule, when must medical certification for an illness absence be turned in?",["At the end of the semester","When the student returns to school, or a day after","Before the absence begins","Within one week"],1,"Medical certification is turned in when the student returns, or a day later.","Problem Sensitivity 2"],["What happens to a student who hands in counterfeit absence certification?",["The absence is excused with a warning","The parents are fined","The absence isn't excused, and the student gets after-school detention","The student is expelled"],2,"Counterfeit proof means the absence is not excused, and the punishment is after-school detention.","Problem Sensitivity 2"]]},{"s":"Interpreting Tables, Graphs and Diagrams","q":[["A firefighter went in at 10:13 with 63 minutes of air. It is now 10:45. How much air is left?",["31 minutes","22 minutes","41 minutes","32 minutes"],0,"32 minutes have been used, and 63 − 32 = 31.","Interpreting Tables Graphs and Diagrams 1"],["It is 05:17 and you have 33 minutes of air left. When will you run out?",["05:40","05:33","05:50","06:00"],2,"05:17 + 33 minutes = 05:50.","Interpreting Tables Graphs and Diagrams 1"],["A firefighter went in at 12:58 with 55 minutes of air and has 31 minutes left. What time is it now?",["13:29","13:12","13:22","13:53"],2,"55 − 31 = 24 minutes used, and 12:58 + 24 = 13:22.","Interpreting Tables Graphs and Diagrams 1"],["A firefighter went in at 14:20. It is now 14:53, with 14 minutes of air left. How much air was in the tank on entry?",["47 minutes","19 minutes","33 minutes","53 minutes"],0,"33 minutes used + 14 left = 47.","Interpreting Tables Graphs and Diagrams 1"],["It is 16:17 and you have 79 minutes of air left. When will you run out?",["17:36","17:46","17:26","17:56"],0,"16:17 + 1 hour 19 minutes = 17:36.","Interpreting Tables Graphs and Diagrams 1"],["A firefighter went in at 18:36 with 37 minutes of air. It is now 19:00. How much air is left?",["11 minutes","3 minutes","24 minutes","13 minutes"],3,"24 minutes used, and 37 − 24 = 13.","Interpreting Tables Graphs and Diagrams 1"],["It is now 21:08. The tank held 94 minutes of air on entry and 63 minutes are left. What time did the firefighter go in?",["20:05","20:37","19:34","20:47"],1,"94 − 63 = 31 minutes used, and 21:08 − 31 = 20:37.","Interpreting Tables Graphs and Diagrams 1"],["The crew arrives at a fire at 16:57 and spends 8 minutes evaluating what to do (the drive from the station takes 5 minutes). When can they first start fighting the fire?",["17:10","17:05","16:52","17:00"],1,"Work starts 8 minutes after arrival: 16:57 + 8 = 17:05. The travel time comes before arrival.","Interpreting Tables Graphs and Diagrams 1"],["A hydrant is 154 yards from the fire engine, and each hose length is 33 yards. How many hoses are needed to reach it?",["5","3","4","6"],0,"154 ÷ 33 ≈ 4.67, so 5 hoses are needed.","Interpreting Tables Graphs and Diagrams 1"],["In the station-cleaning scenario, how much floor does one bottle of special cleaning solution clean?",["7.5 m²","25 m²","15 m²","10 m²"],2,"One bottle of the special cleaning solution cleans 15 m².","Interpreting Tables Graphs and Diagrams 1"],["The fire is 55 feet up and needs 10 bar at the source. Hose pressure drops 2 bar per 10 feet of height. What pressure is needed at the fire engine?",["15.5 bar","21 bar","20 bar","11 bar"],1,"55 ft × 2 bar per 10 ft = 11 bar lost, and 10 + 11 = 21 bar.","Interpreting Tables Graphs and Diagrams 2"],["A fire is on the 14th floor, with floors 2.5 feet high. The line is 5 hose lengths and needs 5 bar at the fire. Pressure drops 1 bar per 10 feet of height and 0.1 bar per hose length. What pump pressure is needed?",["5.5 bar","9 bar","12 bar","8.5 bar"],1,"14 × 2.5 = 35 ft (3.5 bar) plus 5 lengths (0.5 bar) on top of 5 bar = 9 bar.","Interpreting Tables Graphs and Diagrams 2"],["In the chair-arranging scenario, how much space does each chair take up?",["1 m²","1.5 m²","0.75 m²","0.5 m²"],2,"Each chair takes up 0.75 m².","Interpreting Tables Graphs and Diagrams 2"]]},{"s":"Numeracy Skills","q":[["What is the volume of a gas canister with a density of 5 kg/liter and a mass of 20 kilograms?",["4 liters","25 liters","0.25 liters","100 liters"],0,"Volume = mass ÷ density = 20 ÷ 5 = 4 liters.","Numeracy Skills #1"],["What is the area of a trapezoid with an upper base of 16', a lower base of 22' and a height of 35'?",["1,330 square feet","770 square feet","665 square feet","560 square feet"],2,"Area = (16 + 22) ÷ 2 × 35 = 665.","Numeracy Skills #1"],["How many square feet of wood are needed to cut 5 parallelograms, each with a base of 2.5 feet and a height of 8 feet?",["50 square feet","200 square feet","100 square feet","20 square feet"],2,"Each one is 2.5 × 8 = 20 sq ft, and 5 × 20 = 100.","Numeracy Skills #1"],["What is the area of a triangular traffic sign with a base of 2 feet and a height of 1.5 feet?",["1.5 square feet","0.75 square feet","3 square feet","3.5 square feet"],0,"Area = ½ × 2 × 1.5 = 1.5.","Numeracy Skills #1"],["Madison buys 12 triangular pizza slices, each with a base of 0.75 feet and a height of 1.2 feet. How many square feet of pizza is that?",["5.4 square feet","9 square feet","10.8 square feet","0.45 square feet"],0,"Each slice is ½ × 0.75 × 1.2 = 0.45 sq ft, and 12 × 0.45 = 5.4.","Numeracy Skills #1"],["A pyramid mold has a volume of 1/8 cubic feet and a height of 0.5 feet. What is its base area?",["0.0625 square feet","1.5 square feet","0.25 square feet","0.75 square feet"],3,"Base = 3V ÷ h = 3 × 0.125 ÷ 0.5 = 0.75.","Numeracy Skills #1"],["Olive oil boils at 300 °C. What is that in degrees Rankine?",["573.15 °R","1,031.67 °R","759.67 °R","540 °R"],1,"°R = (°C + 273.15) × 9/5 = 573.15 × 1.8 = 1,031.67.","Numeracy Skills #1"],["Antimony melts at 1,625.67 °R. What is that in Celsius?",["903.15 °C","630 °C","1,166 °C","1,352.52 °C"],1,"°C = °R × 5/9 − 273.15 = 903.15 − 273.15 = 630.","Numeracy Skills #1"],["A cylindrical building has a volume of 1,004,800 cubic inches and a height of 800 inches. What is its radius (π ≈ 3.14)?",["20 inches","10 inches","400 inches","40 inches"],0,"r² = V ÷ (πh) = 1,004,800 ÷ 2,512 = 400, so r = 20.","Numeracy Skills #1"],["A gas vaporizes at 855.23 °R. What is that in Fahrenheit?",["202 °F","1,314.9 °F","395.56 °F","582.08 °F"],2,"°F = °R − 459.67 = 395.56.","Numeracy Skills #1"],["A triangle with a base of 60\" and a height of 15\" covers half of a surface. How much of the surface would a triangle with a base of 50\" and a height of 12\" cover?",["One quarter","One third","Two thirds","One half"],1,"The first triangle is 450 sq in, so the surface is 900. The second is 300, which is ⅓ of 900.","Numeracy Skills #1"],["An astronaut with a mass of 70 kg is on the moon, where gravity is 0.16 g. What is his weight?",["70 newtons","About 110 newtons","About 686 newtons","11.2 newtons"],1,"Weight = mass × acceleration = 70 × 0.16 × 9.8 ≈ 110 N.","Numeracy Skills #1"],["A rhombus-shaped kite has an area of 0.6 m² and one diagonal of 0.8 m. How long is the other diagonal?",["0.48 meters","3 meters","1.5 meters","0.75 meters"],2,"Area = d1 × d2 ÷ 2, so d2 = 2 × 0.6 ÷ 0.8 = 1.5.","Numeracy Skills #1"],["Kentucky Lake is about 300.372 K in June. What is that in Celsius?",["-27.222 °C","573.522 °C","81 °C","27.222 °C"],3,"°C = K − 273.15 = 27.222.","Numeracy Skills #1"],["A round cake with a 15 cm radius is cut into 30-degree slices. How long is each slice's arc (π ≈ 3.14)?",["7.85 cm","15.7 cm","3.93 cm","94.2 cm"],0,"Arc = 2πr × 30/360 = 94.2 ÷ 12 = 7.85.","Numeracy Skills #1"],["The forecast is 102 degrees Delisle. What is that in Celsius?",["68 °C","153 °C","32 °C","-53 °C"],2,"°C = 100 − (°De × 2/3) = 100 − 68 = 32.","Numeracy Skills #1"],["What is the mass of a liquid tank with a density of 18 kg/liter and a volume of 3 liters?",["0.17 kg","54 kg","6 kg","21 kg"],1,"Mass = density × volume = 18 × 3 = 54.","Numeracy Skills #2"],["A trapezoid has an area of 840 sq ft, an upper base of 15' and a lower base of 33'. What is its height?",["70 feet","17.5 feet","25 feet","35 feet"],3,"h = 2A ÷ (a + b) = 1,680 ÷ 48 = 35.","Numeracy Skills #2"],["How many square feet of glass are needed for 6 parallelogram panels, each with a base of 3 feet and a height of 7.5 feet?",["22.5 square feet","135 square feet","270 square feet","67.5 square feet"],1,"Each panel is 3 × 7.5 = 22.5 sq ft, and 6 × 22.5 = 135.","Numeracy Skills #2"],["A parallelogram frame has an area of 14 sq ft and a height of 3.5 feet. What is its base?",["2 feet","49 feet","4 feet","8 feet"],2,"Base = area ÷ height = 14 ÷ 3.5 = 4.","Numeracy Skills #2"],["A chair's triangular back has a base of 1.6 feet and an area of 1.2 sq ft. What is its height?",["1.5 feet","0.96 feet","0.75 feet","3 feet"],0,"h = 2A ÷ b = 2.4 ÷ 1.6 = 1.5.","Numeracy Skills #2"],["A pyramid has a base area of 756 sq ft and a height of 481 feet. What is its volume?",["121,212 cubic feet","363,636 cubic feet","60,606 cubic feet","181,818 cubic feet"],0,"V = ⅓ × 756 × 481 = 121,212.","Numeracy Skills #2"],["Petrol boils at 662.67 °R. What is that in Fahrenheit?",["1,122.34 °F","95 °F","368.15 °F","203 °F"],3,"°F = °R − 459.67 = 203.","Numeracy Skills #2"],["Iron melts at 1,538 °C. What is that in degrees Rankine?",["1,997.67 °R","1,811.15 °R","2,768.4 °R","3,260.07 °R"],3,"°R = (1,538 + 273.15) × 1.8 = 3,260.07.","Numeracy Skills #2"],["What is the volume of a cylindrical candle with a radius of 5 inches and a height of 28 inches (π ≈ 3.14)?",["879.2 cubic inches","2,198 cubic inches","4,396 cubic inches","439.6 cubic inches"],1,"V = πr²h = 3.14 × 25 × 28 = 2,198.","Numeracy Skills #2"],["Butane freezes at -220 °F. What is that in degrees Rankine?",["-679.67 °R","239.67 °R","53.15 °R","679.67 °R"],1,"°R = °F + 459.67 = 239.67.","Numeracy Skills #2"],["A quarter of a fabric roll covers a triangle with a base of 25\" and a height of 40\". How many rolls cover a triangle with a base of 160\" and a height of 50\"?",["2 rolls","0.5 roll","4 rolls","8 rolls"],0,"The small triangle is 500 sq in, so a roll is 2,000. The big triangle is 4,000, which is 2 rolls.","Numeracy Skills #2"],["A pyramid jewel has a base area of 3/4 sq in and a volume of 1 cubic inch. What is its height?",["1.33 inches","4 inches","0.75 inches","2.25 inches"],1,"h = 3V ÷ B = 3 ÷ 0.75 = 4.","Numeracy Skills #2"],["What is one interior angle of a regular dodecagon (12 sides)?",["135°","165°","150°","30°"],2,"(12 − 2) × 180 ÷ 12 = 150.","Numeracy Skills #2"],["Isabella buys two boxes, each 7.78\" long, 21.65\" wide and 12\" high. What is their total surface area?",["About 520.6 square inches","About 1,043.2 square inches","About 2,086.4 square inches","About 4,042 square inches"],2,"One box is 2(lw + lh + wh) ≈ 1,043.19 sq in, so two boxes ≈ 2,086.39.","Numeracy Skills #2"],["What is the volume of a pyramid with a base area of 720 sq in and a height of 210 inches?",["151,200 cubic inches","75,600 cubic inches","25,200 cubic inches","50,400 cubic inches"],3,"V = ⅓ × 720 × 210 = 50,400.","Numeracy Skills #2"],["A trapezoid tabletop has an area of 1,120 sq in, an upper base of 32\" and a height of 28\". How long is the lower base?",["16 inches","48 inches","80 inches","40 inches"],1,"a + b = 2A ÷ h = 80, so b = 80 − 32 = 48.","Numeracy Skills #2"],["A rhombus has diagonals of 17 and 32 inches. What is its area?",["136 square inches","272 square inches","544 square inches","49 square inches"],1,"Area = d1 × d2 ÷ 2 = 544 ÷ 2 = 272.","Numeracy Skills #2"],["A flat elliptical monocle has an area of 6.28 sq in and one radius of 0.5 inches. How long is the other radius (π ≈ 3.14)?",["1 inch","2 inches","4 inches","12.56 inches"],2,"A = πab, so b = 6.28 ÷ (3.14 × 0.5) = 4.","Numeracy Skills #2"]]},{"s":"Reading Comprehension","q":[["According to the fireworks article, which is a correct preventive measure for storing fireworks?",["Do not store fireworks near an escape route","Store fireworks in the stairwell","Store fireworks behind the sales counter","Store fireworks next to the shop's exit for quick removal"],0,"The article's correct option is not to store fireworks near an escape route.","Reading Comprehension Understanding Information 01"],["According to the article, what can happen if a fire breaks out in a shop that sells fireworks?",["The fireworks will be ruined but stay harmless","Only the packaging will burn","It can cause an explosion","The sprinklers will always stop the fire"],2,"The article's correct option: if a fire occurs in the shop, this can cause an explosion.","Reading Comprehension Understanding Information 01"],["At a firework display, what is a torch used for?",["To light the fireworks","To mark the safety line","To check the instructions","To signal the crowd"],2,"The image-based question's answer is to check the instructions.","Reading Comprehension Understanding Information 01"],["According to the kitchen safety image, what is the correct fuse for the appliance?",["13 Amp","5 Amp","3 Amp","30 Amp"],0,"The correct option for the fuse question is 13 Amp.","Reading Comprehension Understanding Information 02"],["What is the main purpose of the kitchen and cooking article?",["To ensure safety in the kitchen","To explain how fuses are made","To teach recipes","To sell kitchen appliances"],0,"The correct option for the article's main purpose is to ensure safety in the kitchen.","Reading Comprehension Understanding Information 02"],["According to the article, which is safer for lighting a cooker?",["Lighters held near the gas","Paper spills","Matches","Spark devices"],3,"The article's correct option: spark devices are safer than matches.","Reading Comprehension Understanding Information 02"],["How many accidental fires in the home are started by cooking, according to the article?",["About a tenth","More than half","About a quarter","Almost none"],1,"The correct option is more than half.","Reading Comprehension Understanding Information 02"],["Which electrical safety tip comes from the article?",["Use as many adapters as needed","Don't overload plugs with too many devices","Replace fuses with foil","Keep appliances plugged in under water"],1,"The image-based correct option is not to overload plugs with too many devices.","Reading Comprehension Understanding Information 02"],["Which kitchen safety instruction is correct according to the article?",["Keep lighting items out of reach of children","Store lighters next to the stove","Leave matches on the counter for easy access","Let children light the cooker under supervision"],0,"The correct option: make sure lighting items are kept out of reach of children.","Reading Comprehension Understanding Information 02"],["According to the boat safety article, what should you have on hand for gas safety?",["Scuba diving equipment","Extra gas cylinders inside the cabin","Detection fluid","A spare naked flame"],2,"The correct option is to have detection fluid on hand.","Reading Comprehension Understanding Information 02"],["Where is it better to store gas cylinders on a boat?",["Under the bunks","Outside rather than inside","Next to the engine","Inside the cabin"],1,"The article's correct option: it is better to store gas cylinders outside than inside.","Reading Comprehension Understanding Information 02"],["What does the article say about boat vents in cold weather?",["Only open vents in summer","Even if it is cold, do not cover a vent","Seal vents while cooking","Cover vents when it is cold to keep heat in"],1,"The correct option: even if it is cold, do not cover a vent.","Reading Comprehension Understanding Information 02"],["Which topic is NOT mentioned in the boat safety article?",["Ventilation","Using the right type of fuel","Scuba diving equipment","Gas detection fluid"],2,"Scuba diving equipment is the option marked as not mentioned.","Reading Comprehension Understanding Information 02"],["According to the firefighting equipment article, where is a suitable location for fire extinguishers?",["Outside the building","Locked in a storeroom","In the basement only","On escape routes"],3,"The correct option for extinguisher location is escape routes.","Reading Comprehension Understanding Information 03"],["What does the article say about firefighting equipment in small premises?",["It should be clearly labelled","It is not required","It should be kept off-site","It should be hidden from customers"],0,"The correct option: firefighting equipment in small premises should be clearly labelled.","Reading Comprehension Understanding Information 03"],["Which statement about a large office is UNTRUE according to the article?",["Fire extinguishers can help manage small fires","Extinguishers can be placed on escape routes","Two portable fire extinguishers are sufficient for a large office","Equipment should be clearly labelled"],2,"\"Two portable extinguishers is sufficient for a large office\" is the untrue option.","Reading Comprehension Understanding Information 03"],["Why does the article say it is important to have fire extinguishers?",["They are required only in homes","They can help manage small fires","They replace the need for fire alarms","They can put out any size of fire"],1,"The correct option: fire extinguishers are important because they can help manage small fires.","Reading Comprehension Understanding Information 03"]]},{"s":"Electrical Concepts","q":[["What is an electric current?",["The flow of electric charge","The difference in potential between two points","The resistance of a conductor","The storage of charge in a magnetic field"],0,"An electric current is the flow of electric charge, measured in amperes.","Electrical Concepts"],["What is the unit of measurement for resistance?",["Volt (V)","Farad (F)","Ohm (Ω)","Watt (W)"],2,"Resistance is measured in ohms.","Electrical Concepts"],["What is the difference in electric potential between two points called?",["Current","Capacitance","Voltage","Resistance"],2,"Potential difference is voltage, measured in volts.","Electrical Concepts"],["What is the coulomb the unit of?",["Electric charge","Electric power","Electric current","Magnetic field"],0,"The coulomb is the unit of electric charge.","Electrical Concepts"],["What is the unit of measurement for a magnetic field?",["Tesla","Joule","Coulomb","Ohm"],0,"Magnetic field strength (flux density) is measured in teslas.","Electrical Concepts"],["Which instrument measures electric charge?",["Ohmmeter","Thermometer","Ammeter","Electrometer"],3,"An electrometer measures electric charge. An ammeter measures current.","Electrical Concepts"],["What happens to a circuit's total resistance when another resistor is added in parallel?",["It increases","It decreases","It stays the same","It doubles"],1,"Adding a parallel path lowers the total resistance.","Electrical Concepts"],["What happens to a circuit's total resistance when another resistor is added in series?",["It decreases","It increases","It stays the same","It drops to zero"],1,"Series resistances add together.","Electrical Concepts"],["Three resistors of 20 Ω, 5 Ω and 2 Ω are connected in parallel. What is their total resistance?",["About 1.33 Ω","0.75 Ω","27 Ω","9 Ω"],0,"1/R = 1/20 + 1/5 + 1/2 = 0.75, so R ≈ 1.33 Ω.","Electrical Concepts"],["Three resistors of 6, 3 and 2 Ω are connected in series. What is their total resistance?",["3.67 Ω","36 Ω","11 Ω","1 Ω"],2,"In series, resistances add: 6 + 3 + 2 = 11 Ω.","Electrical Concepts"],["A series circuit has resistors of 5 Ω, 4 Ω and 6 Ω. Through which resistor is the current highest?",["The 6 Ω resistor","The current is the same through all three","The 5 Ω resistor","The 4 Ω resistor"],1,"A series circuit has only one path, so the same current flows through every resistor.","Electrical Concepts"],["A parallel circuit has branches with 5 Ω, 3 Ω, 3 Ω and 1 Ω. Which branch draws the most current?",["Both 3 Ω branches equally","The 1 Ω branch","All branches draw the same current","The 5 Ω branch"],1,"Every parallel branch has the same voltage, so the lowest resistance draws the most current (I = V/R).","Electrical Concepts"],["In a closed circuit with three resistors in parallel, which would INCREASE the total current?",["Increasing each resistor's resistance","Lowering the supply voltage","Adding another resistor in parallel","Removing one of the resistors"],2,"Another parallel branch lowers total resistance, so total current rises.","Electrical Concepts"],["What is the unit of electrical power?",["Ohm","Volt","Ampere","Watt"],3,"Power is measured in watts.","Electrical Concepts"],["What is the unit of electric capacitance?",["Farad","Henry","Coulomb","Tesla"],0,"Capacitance is measured in farads.","Electrical Concepts"],["A 3 Ω resistor is added in parallel to a series chain of 2, 3 and 4 Ω resistors. What is the new total resistance?",["12 Ω","9 Ω","2.25 Ω","1.5 Ω"],2,"The series chain is 9 Ω, and 9 in parallel with 3 is (9 × 3) ÷ (9 + 3) = 2.25 Ω.","Electrical Concepts"],["Electric power depends on which two variables?",["Capacitance and frequency","Voltage and current","Resistance and time","Charge and magnetic field"],1,"P = V × I.","Electrical Concepts"],["Which of these is NOT a good insulator?",["Glass","Rubber","Plastic","Copper"],3,"Copper is a good conductor, not an insulator.","Electrical Concepts"],["By convention, which way does electric current flow in a circuit?",["Back and forth in a direct-current circuit","From the positive terminal to the negative terminal","Only through the insulation","From the negative terminal to the positive terminal"],1,"Conventional current is defined as flowing from positive to negative.","Electrical Concepts"],["Which component lets current flow in only one direction?",["Switch","Capacitor","Diode","Resistor"],2,"A diode limits current flow to a single direction.","Electrical Concepts"],["Which component can break a circuit by interrupting the current or diverting it from one conductor to another?",["Switch","Resistor","Diode","Capacitor"],0,"A switch opens, closes or redirects a circuit.","Electrical Concepts"]]},{"s":"Mechanical Reasoning","q":[["An engineering drawing of a microchip says \"Scale 3:1\". What does that mean?",["The drawing is three times larger than the real object","The object is three times larger than the drawing","Three drawings make one object","The drawing is one third of the real size"],0,"In a 3:1 scale, 3 units on the drawing equal 1 unit on the object.","Mechanical Comprehension- Basic Concepts"],["Sam drew his apartment at a scale of 1:50, and the storeroom is 5 cm wide on the sketch. What is its actual width?",["50 cm","25 meters","2.5 meters","10 cm"],2,"5 cm × 50 = 250 cm = 2.5 m.","Mechanical Comprehension- Basic Concepts"],["Which change is certain to make lifting a load with a first-class (order-1) lever easier?",["Moving the fulcrum closer to the effort","Making the load heavier","Moving the fulcrum closer to the load","Shortening the effort arm"],2,"A longer effort arm and a shorter load arm give more mechanical advantage.","Mechanical Comprehension- Basic Concepts"],["Which tool shows whether a surface is horizontal?",["A level","A tape measure","A square","A protractor"],0,"A level shows whether a surface is horizontal (or vertical).","Mechanical Comprehension- Basic Concepts"],["Which is a unit of electric resistance?",["Ohm","Ampere","Volt","Watt"],0,"Resistance is measured in ohms.","Mechanical Comprehension- Basic Concepts"],["Which is a unit of electric potential?",["Coulomb","Watt","Ohm","Volt"],3,"Potential is measured in volts.","Mechanical Comprehension- Basic Concepts"],["Which is a unit of electric current?",["Volt","Ampere","Ohm","Farad"],1,"Current is measured in amperes.","Mechanical Comprehension- Basic Concepts"],["Which is a unit of electric charge?",["Ampere","Coulomb","Watt","Tesla"],1,"Charge is measured in coulombs.","Mechanical Comprehension- Basic Concepts"],["Which component lets current flow in only one direction?",["Diode","Fuse","Switch","Resistor"],0,"A diode allows current in one direction only.","Mechanical Comprehension- Basic Concepts"],["A 10 N force compresses two identical springs in parallel by 8 cm. How far would the same force compress four of those springs in series?",["4 cm","32 cm","64 cm","16 cm"],2,"Two parallel springs are twice as stiff as one, so one spring would compress 16 cm. Four in series compress 4 × 16 = 64 cm.","Mechanical Reasoning 2"],["A light bulb is rated 10 V, 4 W. What current flows through it?",["40 A","0.4 A","0.04 A","2.5 A"],1,"I = P ÷ V = 4 ÷ 10 = 0.4 A.","Mechanical Reasoning 6 Electrical Drill"],["A light bulb is rated 10 V, 4 W. What is its resistance?",["40 Ω","25 Ω","0.4 Ω","2.5 Ω"],1,"R = V² ÷ P = 100 ÷ 4 = 25 Ω.","Mechanical Reasoning 6 Electrical Drill"],["If a resistor's length is doubled, with the same material and cross-section, its resistance becomes:",["4R","R","2R","R/2"],2,"Resistance is proportional to length.","Mechanical Reasoning 6 Electrical Drill"],["A resistor of radius r has a resistance of 20 Ω. What is the resistance of the same resistor with radius 2r?",["80 Ω","10 Ω","40 Ω","5 Ω"],3,"Doubling the radius makes the area 4 times larger, and resistance falls to ¼: 20 ÷ 4 = 5 Ω.","Mechanical Reasoning 6 Electrical Drill"],["Which material is a good electrical conductor?",["Copper","Rubber","Wood","Glass"],0,"Copper is a good conductor.","Mechanical Reasoning 7 Electrical Drill"],["Which component temporarily stores electrical energy in an electric field?",["Resistor","Switch","Capacitor","Diode"],2,"A capacitor stores energy in an electric field.","Mechanical Reasoning 7 Electrical Drill"],["A light bulb rated 4 W has a resistance of 16 Ω. What current flows at its proper voltage?",["2 A","0.5 A","0.25 A","4 A"],1,"P = I²R, so I = √(4 ÷ 16) = 0.5 A.","Mechanical Reasoning 7 Electrical Drill"],["If a resistor's cross-sectional area is doubled, its resistance becomes:",["4R","2R","R/4","R/2"],3,"Resistance is inversely proportional to cross-sectional area.","Mechanical Reasoning 7 Electrical Drill"],["A battery is connected to a copper thread in parallel with a rubber thread. What happens?",["No current flows at all","Current flows through the copper thread and almost none through the rubber","Equal current flows through both","Current flows only through the rubber thread"],1,"Copper conducts and rubber insulates, so the current takes the copper path.","Mechanical Reasoning 7 Electrical Drill"],["Which is a unit of electric power?",["Coulomb","Ohm","Watt","Joule per coulomb"],2,"Power is measured in watts.","Mechanical Reasoning 7 Electrical Drill"],["A helium balloon floats away to a very high altitude at constant temperature. What happens to its volume?",["It increases","It stays the same","It decreases","It drops to zero"],0,"Air pressure is lower at altitude, and at constant temperature lower pressure means greater volume.","Mechanical Reasoning 8 Pressure Drill"],["An oxygen canister with a pressure gauge is heated. What happens to the pressure?",["It increases","It decreases","It drops to zero","It stays the same"],0,"At a fixed volume, pressure rises with temperature.","Mechanical Reasoning 8 Pressure Drill"],["A canister of oxygen at 25 °C is connected to an identical empty canister. What will the gauge show?",["Double the original pressure","The same pressure","Zero","Half the original pressure"],3,"The same gas fills twice the volume at the same temperature, so the pressure halves.","Mechanical Reasoning 8 Pressure Drill"],["More oxygen gas is added to the canister at the same temperature. What will the gauge show?",["Zero","A lower pressure","The same pressure","A higher pressure"],3,"More gas in the same volume means higher pressure.","Mechanical Reasoning 8 Pressure Drill"],["Oxygen is added to the canister while it is cooled at the same time. What will the gauge show?",["The pressure definitely falls","It cannot be determined from the information given","The pressure stays exactly the same","The pressure definitely rises"],1,"Adding gas raises pressure and cooling lowers it. Without amounts, the net change is unknown.","Mechanical Reasoning 8 Pressure Drill"]]}];

let st=load();
function blank(){return {v:1,rec:{},sel:-1,shuffle:false,session:null,updated:0}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1&&j.rec)return Object.assign(blank(),j)}catch(e){}return blank()}
function save(){st.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){toast("Could not save progress on this browser")}}
function stats(ids){let a=0,c=0,m=0;ids.forEach(id=>{const r=st.rec[id];if(r){a++;r.last?c++:m++}});return {t:ids.length,a,c,m,p:a?Math.round(c/a*100):0}}
const idsOf=si=>si<0?ALL:ALL.filter(id=>id.startsWith(si+"-"));
function bar(el,s){el.innerHTML=`<i class="g" style="width:${s.c/s.t*100}%"></i><i class="r" style="width:${s.m/s.t*100}%"></i>`}
function statLine(s){return `${s.a}/${s.t} answered · ${s.c} correct · ${s.m} missed · ${s.p}%`}
function show(sec){["home","quiz","results"].forEach(x=>$(x).classList.toggle("hidden",x!==sec));$("homeBtn").classList.toggle("hidden",sec==="home");window.scrollTo(0,0)}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2200)}

function renderHome(){
  const o=stats(ALL);$("ovStats").textContent=statLine(o);bar($("ovBar"),o);
  const box=$("subjects");box.innerHTML="";
  const mk=(si,name)=>{const s=stats(idsOf(si));const b=document.createElement("button");b.className="subj"+(st.sel===si?" sel":"");b.dataset.si=si;
    b.innerHTML=`<b></b><div class="stats"></div><div class="bar"></div>`;b.querySelector("b").textContent=name+(si<0?"":` (${s.t})`);
    b.querySelector(".stats").textContent=statLine(s);bar(b.querySelector(".bar"),s);
    b.onclick=()=>{st.sel=si;save();renderHome()};box.appendChild(b)};
  mk(-1,`All subjects (${ALL.length})`);DATA.forEach((s,i)=>mk(i,s.s));
  $("shuffle").checked=!!st.shuffle;
  const miss=idsOf(st.sel).filter(id=>st.rec[id]&&!st.rec[id].last).length;
  $("missBtn").textContent=`Review missed (${miss})`;$("missBtn").disabled=!miss;
  const ss=st.session;$("resume").classList.toggle("hidden",!(ss&&ss.i<ss.ids.length));
  if(ss)$("resumeInfo").textContent=`${ss.label} · question ${Math.min(ss.i+1,ss.ids.length)} of ${ss.ids.length}`;
  $("storeInfo").textContent=st.updated?("Last saved "+new Date(st.updated).toLocaleString()):"No answers saved yet.";
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(ids,label,mode){
  if(!ids.length){toast("No questions to show");return}
  st.session={ids:st.shuffle?shuf(ids):ids.slice(),i:0,res:{},label,mode,answered:null};save();renderQ();show("quiz");
}
const selName=()=>st.sel<0?"All subjects":DATA[st.sel].s;
function renderQ(){
  const ss=st.session;if(!ss)return show("home");
  if(ss.i>=ss.ids.length)return renderResults();
  const id=ss.ids[ss.i],{s,d}=getQ(id);
  $("title").textContent=ss.mode==="missed"?"Review missed":"Quiz";
  $("qPos").textContent=`Question ${ss.i+1} of ${ss.ids.length}`;
  const vals=Object.values(ss.res);$("qScore").textContent=`${vals.filter(x=>x).length} right · ${vals.filter(x=>!x).length} wrong`;
  $("qSubj").textContent=(d[4]&&d[4].startsWith(DATA[s].s))?d[4]:DATA[s].s+(d[4]?" — "+d[4]:"");
  $("qText").textContent=d[0];
  const box=$("opts");box.innerHTML="";
  d[1].forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="l">${L[k]}</span><span></span>`;b.lastChild.textContent=o;b.onclick=()=>answer(k);box.appendChild(b)});
  $("fb").classList.add("hidden");$("nextBtn").classList.add("hidden");
  renderRec(id);
  if(ss.answered!==null&&ss.answered!==undefined&&ss.res[id]!==undefined)paint(ss.answered,d);
}
function renderRec(id){const r=st.rec[id];$("qRec").textContent=r?`Your record: last time ${r.last?"right ✓":"wrong ✗"} · ${r.r} right, ${r.w} wrong`:"Your record: not answered yet";}
function paint(k,d){
  const btns=$("opts").children;for(let j=0;j<4;j++){btns[j].disabled=true;if(j===d[2])btns[j].classList.add("ok");else if(j===k)btns[j].classList.add("bad")}
  const ok=k===d[2],fb=$("fb");fb.className="fb "+(ok?"ok":"bad");
  fb.innerHTML=`<h3></h3><div></div>`;fb.firstChild.textContent=ok?"Correct!":`Wrong — the answer is ${L[d[2]]}. ${d[1][d[2]]}`;fb.lastChild.textContent=d[3];
  const nb=$("nextBtn");nb.classList.remove("hidden");nb.textContent=st.session.i+1<st.session.ids.length?"Next":"See results";
}
function answer(k){
  const ss=st.session,id=ss.ids[ss.i],{d}=getQ(id);if(ss.res[id]!==undefined)return;
  const ok=k===d[2];const r=st.rec[id]||{last:0,r:0,w:0};r.last=ok?1:0;ok?r.r++:r.w++;st.rec[id]=r;
  ss.res[id]=ok;ss.answered=k;save();paint(k,d);renderRec(id);
  const vals=Object.values(ss.res);$("qScore").textContent=`${vals.filter(x=>x).length} right · ${vals.filter(x=>!x).length} wrong`;
}
function next(){const ss=st.session;ss.i++;ss.answered=null;save();renderQ();window.scrollTo(0,0)}
function renderResults(){
  const ss=st.session;const ids=Object.keys(ss.res);const c=ids.filter(i=>ss.res[i]).length,w=ids.length-c;
  $("title").textContent="Results";$("rSubj").textContent=ss.label+(ss.mode==="missed"?" · Review missed":"");
  $("rPct").textContent=ids.length?Math.round(c/ids.length*100)+"%":"—";
  $("rLine").textContent=`${c} right · ${w} wrong · ${ids.length} answered`;
  const wrong=ids.filter(i=>!ss.res[i]);$("retryBtn").disabled=!wrong.length;$("retryBtn").textContent=`Retry missed (${wrong.length})`;
  const list=$("rList");list.innerHTML=wrong.length?"<b>Missed this session</b>":"<b>No misses this session. Nice work!</b>";
  wrong.forEach(id=>{const {s,d}=getQ(id);const e=document.createElement("div");e.className="missli";e.innerHTML="<div></div><div class='small'></div>";e.firstChild.textContent=d[0];e.lastChild.textContent=`${DATA[s].s} · Answer: ${L[d[2]]}. ${d[1][d[2]]}`;list.appendChild(e)});
  ss.done=wrong;show("results");
}
function endSession(){const ss=st.session;if(ss&&Object.keys(ss.res).length){ss.i=ss.ids.length;save();renderResults()}else{st.session=null;save();goHome()}}
function goHome(){if(st.session&&st.session.i>=st.session.ids.length)st.session=null;save();$("title").textContent="Fire Fighter Exam Trainer";renderHome();show("home")}
function ask(title,text,yes,fn){$("cTitle").textContent=title;$("cText").textContent=text;$("cYes").textContent=yes;$("confirm").classList.remove("hidden");$("cYes").onclick=()=>{$("confirm").classList.add("hidden");fn()};}
$("cNo").onclick=()=>$("confirm").classList.add("hidden");
$("shuffle").onchange=e=>{st.shuffle=e.target.checked;save()};
$("startBtn").onclick=()=>startSession(idsOf(st.sel),selName(),"all");
$("missBtn").onclick=()=>startSession(idsOf(st.sel).filter(id=>st.rec[id]&&!st.rec[id].last),selName(),"missed");
$("resumeBtn").onclick=()=>{renderQ();show("quiz")};
$("nextBtn").onclick=next;$("endBtn").onclick=endSession;
$("homeBtn").onclick=goHome;$("rHome").onclick=goHome;
$("retryBtn").onclick=()=>{const ss=st.session;startSession(ss.done||[],ss.label,"missed")};
$("resetBtn").onclick=()=>ask("Reset progress?","This erases every saved answer on this device. Export first if you want a backup.","Reset",()=>{const keep={shuffle:st.shuffle,sel:st.sel};st=Object.assign(blank(),keep);save();renderHome();toast("Progress reset")});
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"ff-exam-trainer",exported:new Date().toISOString(),data:st},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ff-trainer-progress-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Progress file downloaded");
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const d=j.data||j;if(!d||d.v!==1||typeof d.rec!=="object")throw 0;
  const n=Object.keys(d.rec).filter(k=>ALL.includes(k)).length;
  ask("Import progress?",`Replace the progress on this device with the file's ${n} answered questions?`,"Import",()=>{st=Object.assign(blank(),d);save();renderHome();toast("Progress imported")});
}catch(x){toast("That file isn't a valid progress export")}e.target.value=""};rd.readAsText(f)};
window.addEventListener("pagehide",save);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
renderHome();
if(st.session&&st.session.i<st.session.ids.length&&location.hash==="#resume"){renderQ();show("quiz")}
window.__ff={get state(){return st}};
})();
</script>
</body>
</html>
