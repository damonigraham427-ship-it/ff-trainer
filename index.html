<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FF Trainer">
<title>Fire Fighter Exam Trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--red:#b91c1c;--red2:#dc2626;--bg:#f5f5f4;--card:#fff;--ink:#1c1917;--mute:#57534e;--line:#e7e5e4;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 30px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;background:var(--red);color:#fff;margin-top:10px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.subj{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit}
.subj.sel{border:2px solid var(--red);padding:11px 13px}
.subj b{font-size:16px}
.stats{font-size:13px;color:var(--mute);margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--red2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .btn{margin-top:0}
label.tog{display:flex;align-items:center;justify-content:space-between;font-size:16px}
label.tog input{width:22px;height:22px;accent-color:var(--red)}
.qmeta{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.qtext{font-size:18px;font-weight:600;margin:4px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font:inherit;font-size:17px;color:inherit;min-height:56px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .l{background:var(--bad);color:#fff}
.fb{border-radius:12px;padding:12px 14px;margin:4px 0 6px}
.fb.ok{background:var(--okbg);color:#14532d}.fb.bad{background:var(--badbg);color:#7f1d1d}
.fb h3{margin:0 0 4px;font-size:17px}
.rec{font-size:13px;color:var(--mute);margin-top:6px}
.big{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.center{text-align:center}
.small{font-size:13px;color:var(--mute)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools .btn{margin-top:0;font-size:15px;padding:12px}
.danger{color:var(--bad)!important}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .card{max-width:420px;width:100%}
.missli{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
</style>
</head>
<body>
<header><h1 id="title">Fire Fighter Exam Trainer</h1><button id="homeBtn" class="hidden">Home</button></header>
<main>
<section id="home">
  <div class="card">
    <div class="row"><div style="flex:1"><b id="ovTitle">Overall</b><div class="stats" id="ovStats"></div></div></div>
    <div class="bar" id="ovBar"></div>
  </div>
  <div id="resume" class="card hidden">
    <b>Unfinished session</b><div class="stats" id="resumeInfo"></div>
    <button class="btn" id="resumeBtn">Resume</button>
  </div>
  <div class="card">
    <label class="tog">Shuffle questions <input type="checkbox" id="shuffle"></label>
  </div>
  <div class="modes" style="margin-bottom:14px">
    <button class="btn" id="startBtn">Start quiz</button>
    <button class="btn sec" id="missBtn">Review missed</button>
  </div>
  <div class="small" style="margin:0 2px 8px">Choose a subject:</div>
  <div id="subjects"></div>
  <div class="card">
    <b>Your progress</b>
    <div class="small" style="margin:4px 0 10px">Progress saves on this device after every answer. Use Export to back it up or move it to another phone, then Import it there.</div>
    <div class="tools">
      <button class="btn sec" id="exportBtn">Export progress</button>
      <button class="btn sec" id="importBtn">Import progress</button>
    </div>
    <button class="btn sec danger" id="resetBtn">Reset progress</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    <div class="small" id="storeInfo" style="margin-top:10px"></div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="qmeta"><span id="qPos"></span><span id="qScore"></span></div>
    <div class="qmeta"><span id="qSubj"></span></div>
    <div class="qtext" id="qText"></div>
    <div id="opts"></div>
    <div id="fb" class="fb hidden"></div>
    <div class="rec" id="qRec"></div>
    <button class="btn hidden" id="nextBtn">Next</button>
  </div>
  <button class="btn sec" id="endBtn">End session</button>
</section>

<section id="results" class="hidden">
  <div class="card center">
    <div class="small" id="rSubj"></div>
    <div class="big" id="rPct"></div>
    <div id="rLine"></div>
  </div>
  <button class="btn" id="retryBtn">Retry missed</button>
  <button class="btn sec" id="rHome">Back to subjects</button>
  <div class="card" style="margin-top:12px" id="rList"></div>
</section>
</main>
<div id="toast"></div>
<div id="confirm" class="modal hidden"><div class="card">
  <b id="cTitle">Reset progress?</b>
  <p class="small" id="cText"></p>
  <div class="tools"><button class="btn sec" id="cNo">Cancel</button><button class="btn" id="cYes">Reset</button></div>
</div></div>

<script>
const DATA = [{"s":"Tools","q":[["According to the material, a crowbar is an example of which type of lever?",["A first class lever","It is not a lever","A third class lever","A second class lever"],0,"The crowbar's fulcrum lets the user apply force to separate adjacent objects, which makes it a first class lever.","Tools — Lever Class Examples"],["In a pair of scissors used as a first class lever, which part is the fulcrum?",["The blades","The load being cut","The hinge","The handles"],2,"The hinge is the fulcrum, the input force goes on the handles, and the output force comes from the blades.","Tools — Lever Class Examples"],["Which of these tools is given as an example of a second class lever?",["Pliers","Staple remover","Nutcracker","Tweezers"],2,"The nutcracker is a second class lever, with the hinge as the fulcrum and the load in the middle.","Tools — Lever Class Examples"],["Besides the nutcracker, which two items are named as additional examples of second class levers?",["Bottle opener and wheelbarrow","Tongs and pincers","Seesaw and crowbar","Shovel and tweezers"],0,"\"Additional examples to second class levers are a bottle opener and a wheelbarrow.\"","Tools — Lever Class Examples"],["In a second class lever such as the nutcracker, where is the load located?",["In the middle, between the hinge and where the force is applied","Outside the hinge, beyond the fulcrum","At the hinge","At the ends of the handles, where the force is applied"],0,"For the nutcracker, the hinge is the fulcrum, force goes on the other end of the handles, and the load is in the middle.","Tools — Lever Class Examples"],["A staple remover is classified as which type of lever?",["A second class lever","It is not a lever","A first class lever","A third class lever"],3,"The staple remover has its hinge at one end, the input force in the middle, and the output at the teeth, so it is a third class lever.","Tools — Lever Class Examples"],["On a staple remover, where is the input force applied?",["At the hinge","To the middle of the lever","At the teeth","Equally at both ends"],1,"The input force is applied to the middle of the lever, and the teeth at the other end extract the staple.","Tools — Lever Class Examples"],["Why is a screwdriver NOT classified as a lever of any class?",["It is too short to multiply force","Its use does not require a fulcrum or a hinge movement","It turns screws only with a Phillips head","Its handle acts as the load"],1,"\"The use of a screwdriver does not require a fulcrum or a hinge-movement, and therefore it is not classified as a lever of any class.\"","Tools — Lever Class Examples"],["Which group lists ONLY third class levers?",["Tweezers, tongs and pincers","Crowbar, claw hammer and seesaw","Pliers, scissors and crowbar","Nutcracker, bottle opener and wheelbarrow"],0,"Tweezers, tongs and pincers are named together as examples of third class levers.","Tools — Lever Class Examples"],["When a shovel is used as a third class lever, where is the fulcrum?",["Where the blade touches the ground","In the middle of the handle","At the edge of the handle, where the user grips the shovel","At the blade"],2,"For the shovel, the gripped end of the handle is the fulcrum, the input force goes in the middle, and the blade carries the load.","Tools — Lever Class Examples"],["Which of the following is NOT a first class lever?",["Claw hammer","Chopsticks","Crowbar","Pliers"],1,"In the source's practice question, pliers, claw hammer and crowbar are first class levers, and chopsticks is the correct answer as the odd one out.","Tools — Lever Class Examples"],["Which tool has a flattened, sharp edge and is used for carving with a mallet?",["Putty knife","Chisel","Glass cutter","Screwdriver"],1,"A chisel has a flattened, sharp edge (a screwdriver has only a plain shaft) and is used for carving with a mallet.","Tools 1 — Tools and Uses"],["What is a jack used for?",["Holding two work pieces together","Digging in construction","Lifting heavy objects such as vehicles","Breaking hard materials such as concrete"],2,"A jack lifts heavy objects such as vehicles, and most jacks use hydraulic power.","Tools 1 — Tools and Uses"],["Which tool combines a hammer and a chisel and can be pneumatic or electric?",["Pickaxe","Air hammer","Sledgehammer","Jackhammer"],3,"A jackhammer is a construction digging device that combines a hammer and a chisel and is pneumatic or electric.","Tools 1 — Tools and Uses"],["Which hammer is described as THE tool for general carpentry?",["Claw hammer","Sledgehammer","Air hammer","Ball-peen hammer"],0,"The claw hammer is the tool for general carpentry, and the sledgehammer is too big and clumsy for that job.","Tools 1 — Tools and Uses"],["Which hammer has a head side that makes it ideal for metalwork?",["Claw hammer","Jackhammer","Ball-peen hammer","Sledgehammer"],2,"One side of the ball-peen hammer's head makes it ideal for metalwork.","Tools 1 — Tools and Uses"],["A welder is used for:",["Temporarily holding metal parts in place","Permanently joining pieces of metal together","Repairing electronic assemblies","Cutting sheet metal into pieces"],1,"Welding is the process of permanently joining multiple pieces of metal together. Soldering, not welding, suits electronic assemblies.","Tools 1 — Tools and Uses"],["Nuts, nails and screws are all types of:",["Clamps","Hinges","Levers","Fasteners"],3,"Nuts and nails are fasteners, which are devices that join or attach two or more objects together.","Tools 1 — Tools and Uses"],["An air hammer is used for:",["Lifting vehicles","Carving or shaping metal or stone","Driving nails in carpentry","Digging through soil"],1,"An air hammer is a pneumatic hand tool used for carving or shaping metal or stone.","Tools 1 — Tools and Uses"],["What is the main difference between an open-end wrench and a crescent wrench?",["The open-end wrench has an enclosed opening","The crescent wrench is used only for pipes","The crescent wrench is adjustable to fit different-sized bolts and nuts","The open-end wrench is adjustable and the crescent wrench is not"],2,"An open-end wrench is a one-piece wrench with openings on both sides, while a crescent wrench is adjustable.","Tools 1 — Tools and Uses"],["What is the difference between a screw and a bolt?",["A screw has a sharp end that makes its own hole, while a bolt needs a fitted hole and is tightened with a wrench","A screw is tightened with a wrench, while a bolt is tightened with a screwdriver","A bolt has a slotted head, while a screw does not","A bolt has a sharp end and is used mostly on wood"],0,"A screw has a sharp end and a slotted head and is turned with a screwdriver. A bolt has a truncated end, needs a fitted hole, and is turned with a wrench.","Tools 1 — Tools and Uses"],["A level is designed to indicate:",["Whether an object is horizontal or vertical","Whether an object has a right angle","The torque applied to a bolt","The distance between two points"],0,"A level shows whether an object is horizontal or vertical using a vial of liquid with an air bubble. A square checks right angles.","Tools 1 — Tools and Uses"],["What does a C-clamp do?",["It grips bolts and nuts and applies torque to turn them","It measures whether an object has a right angle","It makes a shallow slot in glass","It holds two work pieces together, tightened by an adjustable screw"],3,"A C-clamp has a C-shaped metal frame and an adjustable screw that tightens two work pieces together.","Tools 1 — Tools and Uses"],["Why do slip-joint pliers open wider than other pliers?",["Because they adjust with a thumbscrew","Because they have longer handles","Because they have a pointed end","Because of the slip joint"],3,"Slip-joint pliers open wider because of the slip joint. Needle-nose pliers have the pointed end for small places.","Tools 1 — Tools and Uses"],["Which statement about a staple gun is correct?",["It melts a cartridge before releasing it","It does not require electricity","It is operated with a thumbscrew","It must be plugged into an electrical outlet"],1,"When the staple gun is against a surface, pushing the trigger releases a staple, and it does not require electricity.","Tools 2 — Tools and Uses"],["Which tool is supplied with solid cylindrical sticks that are melted and pushed out by a trigger?",["Staple gun","Glue gun","Soldering iron","Electric saber saw"],1,"A glue gun is an electric tool that melts glue sticks and pushes the glue out with a trigger.","Tools 2 — Tools and Uses"],["Which of these is a short, generally double-bladed knife used mostly as a weapon?",["Dagger","Putty knife","Glass cutter","Utility knife"],0,"A dagger is a short, generally double-bladed knife used mostly as a weapon.","Tools 2 — Tools and Uses"],["A soldering iron is used to:",["Permanently join large pieces of structural metal","Solder components to printed circuits with heat generated by electricity","Cut glass into two pieces","Measure temperature on a scale"],1,"A soldering iron uses electric heat to solder components to printed circuits, for installing and repairing electronic assemblies.","Tools 2 — Tools and Uses"],["A claw hammer is used for:",["Pounding and extracting bolts","Pounding and extracting pins","Pounding and extracting nails","Pounding and extracting screws"],2,"The claw hammer's flat side pounds nails, and its curved claw extracts them.","Tools 2 — Tools and Uses"],["Which tool is best used for precise woodwork?",["Pipe wrench","Hacksaw","Tenon saw","Sledgehammer"],2,"A tenon saw is used with one hand and suits precise woodwork because its blade has fine teeth.","Tools 2 — Tools and Uses"],["A hacksaw is used for cutting:",["Glass","Concrete walls","Fine joints in precise woodwork","Metal or plastic"],3,"A hacksaw is a fine-toothed hand saw used for cutting metal or plastic.","Tools 2 — Tools and Uses"],["What is the difference between a nut and a wing nut?",["There is no difference; the names are interchangeable","A wing nut is tightened by hand, while a nut requires a wrench","A nut is tightened by hand, while a wing nut requires a wrench","A wing nut needs a screwdriver, while a nut needs pliers"],1,"A wing nut is tightened by hand with no extra tool, while a nut (a small six-sided metal block) needs a wrench.","Tools 2 — Tools and Uses"],["How is a crescent wrench adjusted?",["It cannot be adjusted","With a thumbscrew that moves one part while the other stays fixed","With a slip joint, like slip-joint pliers","By swapping sockets on the handle"],1,"On a crescent wrench, one part does not move and the other is adjusted with a thumbscrew.","Tools 2 — Tools and Uses"],["Which wrench consists of a handle and at least one socket that attaches to it?",["Crescent wrench","Pipe wrench","Socket wrench","Box-end wrench"],2,"A socket wrench is a handle plus at least one attachable socket, so it works with different-sized bolts and nuts.","Tools 2 — Tools and Uses"],["Besides drilling holes, what else can an electric drill do?",["Turn screws, when a screwdriver bit is installed","Cut wood with saber blades","Measure distances","Melt glue sticks"],0,"An electric drill uses replaceable bits, and a screwdriver bit can be installed to turn screws.","Tools 2 — Tools and Uses"],["For demolition work, which sledgehammer requires MORE effort?",["The one with the shorter handle","The one with the longer handle","Both will require the same effort","Insufficient data"],0,"The shorter-handled sledgehammer creates a weaker force and needs more effort.","Tools 2 — Tools and Uses"],["Which pliers can be adjusted to several different open positions?",["Tongs","Tweezers","Channel-lock pliers","Needle-nose pliers"],2,"Channel-lock pliers adjust to several open positions. Needle-nose pliers have a pointed end for small places.","Tools 2 — Tools and Uses"],["A fire flapper puts out fires by removing which part of the fire tetrahedron?",["Oxidizing agent","Heat","Fuel","Chain reaction"],0,"The fire flapper smothers minor rural fires. When it hits the ground, the fire underneath loses oxygen, which is the oxidizing agent.","Tools 3 — Tools and Uses"],["A shove knife is used for:",["Extricating crash victims","Removing a cylinder lock from an outer door","Forcible entry through interior doors with minimal damage","Cutting through metal sheets"],2,"The shove knife's hook slips between the door and frame to catch and depress the spring latch, which opens the door with minimal damage.","Tools 3 — Tools and Uses"],["What is an advantage of a dry pipe sprinkler system?",["It needs no water supply","It can be aimed at a location without personnel","It works in temperatures that would freeze water in a wet pipe system","It puts water on the fire faster than any other system"],2,"Dry pipe systems keep no water in the pipes until they turn on, so they work in freezing conditions such as unheated buildings and parking garages.","Tools 3 — Tools and Uses"],["The rabbit tool is designed to:",["Open doors that swing away from the operator (inward-swinging doors)","Pull down ceiling material","Remove cylinder locks","Connect a small hose to a larger one"],0,"The rabbit tool is a handheld hydraulic tool that pushes outward to open doors that swing away from the operator.","Tools 3 — Tools and Uses"],["What does a strainer do?",["It boosts the pressure inside the hose","It keeps foreign objects out of a hose or pump, especially when drawing from a natural water source","It connects a smaller hose to a larger hose","It lets water flow in only one direction"],1,"A strainer is a large metal device on the end of a suction hose that keeps foreign objects out of the hose or pump.","Tools 3 — Tools and Uses"],["An increaser is used to:",["Increase water pressure at the nozzle","Attach a larger-diameter hose to a smaller-diameter hose","Attach a smaller-diameter hose to a larger-diameter hose","Keep debris out of the pump"],2,"An increaser is an adapter that connects a smaller hose source to a larger hose receiver.","Tools 3 — Tools and Uses"],["Used together with other tools, a K-tool can effectively:",["Find fires in attics","Tie two ropes together","Open inward-swinging doors with hydraulic pressure","Remove a cylinder lock"],3,"Used with other tools, the K-tool can remove a cylinder lock to breach outer doors.","Tools 3 — Tools and Uses"],["What is an advantage of a hook (pompier) ladder over other firefighter ladders?",["It can be used as a water jet platform","It can hook onto windowsills to scale a building from the outside, floor by floor","It is the longest ladder carried on the apparatus","It is self-supporting on flat ground"],1,"The hook ladder hooks over windowsills, so firefighters can climb a building from the outside by re-hooking on higher windows.","Tools 3 — Tools and Uses"],["Compared with a standard fire hose, a suction hose better withstands:",["Vacuum","Heat","Abrasion","Excessive bending"],0,"The pump creates a vacuum to draw water from an unpressurized source, so the suction hose must withstand vacuum.","Tools 3 — Tools and Uses"],["What is the purpose of a check valve?",["It connects hoses of different diameters","It keeps foreign objects out of the pump","It shows the water pressure in the line","It allows fluid or gas to flow in only one direction"],3,"A check valve only allows fluid or gas to flow in one direction.","Tools 3 — Tools and Uses"],["Which tool would be most useful for finding fires in attics?",["Wire and bolt cutters","Pike pole","Sledge hammer","Pick-head axe"],1,"The pike pole is thrust into the ceiling, twisted so its hook catches, and pulled down to remove ceiling material.","Tools 3 — Tools and Uses"],["Which of these tools CANNOT be used for forcible entry with reasonable efficiency?",["Deluge (deck) gun","Halligan bar","Pry axe","Denver (TNT) tool"],0,"A deluge gun is a water jet that can be left aimed at one spot. It cannot be used for forcible entry, while the Halligan bar is very efficient for it.","Tools 3 — Tools and Uses"],["Which tool combines an axe, a sledgehammer, a ram, a D-handle and a pry tool?",["Pike pole","Halligan bar","Pry axe","Denver (TNT) tool"],3,"The Denver (TNT) tool combines those five parts and is an efficient forcible entry tool.","Tools 3 — Tools and Uses"],["Which knot is used to tie two ropes together?",["Clove hitch","Becket bend","Bowline","Figure-eight"],1,"The source identifies the pictured knot as the Becket bend, used to tie two ropes together.","Tools 3 — Tools and Uses"],["You would use a Class D extinguisher when a fire burns on:",["Flammable liquids","Ordinary wood and paper","Combustible metals, such as magnesium","Energized electrical equipment"],2,"Magnesium is a combustible metal, and Class D extinguishers are used on combustible metals.","Tools 3 — Tools and Uses"],["What are the jaws of life (hydraulic rescue tools) used for?",["Breaching inward-swinging doors","Extricating crash victims","Removing ceiling material in attics","Suffocating minor rural fires"],1,"The jaws of life are used to extricate crash victims.","Tools 3 — Tools and Uses"]]},{"s":"Logical Reasoning","q":[["Doris is twice as old as Emily. Emily is five years older than Francis. Doris is 20 years old. How old is Emily?",["10","5","15","40"],0,"Doris (20) is twice Emily's age, so Emily is 10. The conclusion \"Emily is 40\" is disproved.","Logical Reasoning 1"],["Facts: Mark always jogs around his neighborhood in the morning unless it is raining or snowing; when it is, he jogs at an indoor track. This morning Mark jogged around his neighborhood. Conclusion: It did not rain this morning.",["The facts disprove the conclusion","The facts contradict each other","The facts prove the conclusion","The facts neither prove nor disprove the conclusion"],2,"He only jogs in the neighborhood when it is not raining or snowing, so it did not rain.","Logical Reasoning 1"],["Facts: If Jason is late to the meeting, Kevin must work late. Lois will not cook dinner for Kevin unless he gets home from work on time. Lois cooked dinner for Kevin. What follows?",["Jason was late to the meeting","Kevin had to work late","Jason was not late to the meeting","Kevin ordered pizza for dinner"],2,"Lois cooked, so Kevin got home on time and did not work late. So Jason was not late, and the conclusion \"Jason was late\" is disproved.","Logical Reasoning 1"],["Gary works on the eighth floor of a ten-floor building, and Fred works two floors below Gary. On which floor does Fred work?",["The 6th floor","The 10th floor","The 3rd floor","The 4th floor"],0,"8 − 2 = 6, which is in the upper half (floors 6–10), so \"Fred works in the upper half\" is proved.","Logical Reasoning 1"],["Facts: Catherine has $20. Dana has more money than Emily, but less than twice as much as Catherine. Conclusion: Dana has more money than Catherine.",["The facts neither prove nor disprove the conclusion","The facts contradict each other","The facts prove the conclusion","The facts disprove the conclusion"],0,"Dana has less than $40, but nothing says whether Dana has more or less than $20.","Logical Reasoning 1"],["Four students took a test with no tied scores. Irving got 93, Sheldon got 77, and the average was 82. What was the combined score of Wendy and Tessa?",["170","148","164","158"],3,"4 × 82 = 328, and 328 − 93 − 77 = 158. Wendy could still be above or below 82, so that conclusion is neither proved nor disproved.","Logical Reasoning 1"],["Facts: The market gained 200 points Monday, lost 1% Tuesday, gained 1% Wednesday, lost 200 points Thursday and gained 1 point Friday. Conclusion: The market ended the week higher than it started.",["The facts prove the conclusion","The facts neither prove nor disprove the conclusion","The facts disprove the conclusion","The facts contradict each other"],1,"The net result depends on the starting value, because the 1% moves change size with the market's level.","Logical Reasoning 1"],["Facts: Andy only likes words that start with vowels. Cody only likes words that start with C. Conclusion: Andy and Cody do not both like any of the same words.",["The facts disprove the conclusion","The facts prove the conclusion","The facts neither prove nor disprove the conclusion","The facts contradict each other"],1,"C is a consonant, so no word can start with both a vowel and C.","Logical Reasoning 1"],["On the planet Glorp, male names have an odd number of syllables and female names an even number. A child is named Angela. What is the child?",["Male, because An-ge-la has three syllables","It cannot be determined from the facts","Female, because An-ge-la has three syllables","Female, because An-ge-la has two syllables"],0,"Angela has 3 syllables, an odd number, so the conclusion \"the child is female\" is disproved.","Logical Reasoning 1"],["Facts: Josh's wallet holds only $1 and $5 bills, and he has twice as many $5 bills as $1 bills. Conclusion: Josh's wallet contains exact change for a $20 bill.",["The facts contradict each other","The facts disprove the conclusion","The facts neither prove nor disprove the conclusion","The facts prove the conclusion"],2,"With one $1 and two $5s he has only $11. With two $1s and four $5s he can make $20. So it depends on how many bills he has.","Logical Reasoning 1"],["Robert, Sam and Tom each have a different favorite food: cheese, ice cream or steak. Robert's is cheese and Sam's is not ice cream. Which is true?",["Sam's favorite is cheese","Tom's favorite is ice cream and Sam's is steak","Tom's favorite is cheese","Tom's favorite is steak and Sam's is ice cream"],1,"Sam can't have cheese (Robert's) or ice cream, so Sam has steak and Tom has ice cream.","Logical Reasoning 1"],["David must finish all his homework before watching an 8 PM show. He starts homework the moment he gets home, it takes 3 hours, and he is allowed to watch the show. What is the latest he could have gotten home?",["6:00 PM","5:00 PM","4:30 PM","5:30 PM"],1,"8 PM minus 3 hours is 5 PM, so \"David got home at 5:30 PM\" is disproved.","Logical Reasoning 1"],["Abbie, Bill, Connie and Dylan are two married couples. Connie is married to the man who plays basketball, Dylan plays squash, and Bill is not married to the woman who plays tennis. Who plays tennis?",["Bill","Dylan","Abbie","Connie"],2,"Dylan plays squash, so Bill is the basketball player married to Connie. Bill's wife doesn't play tennis, so Abbie does.","Logical Reasoning 1"],["Morning shifts are 7 hours and afternoon shifts 8 hours. Stella works both morning and afternoon shifts. Salespersons never work seven-hour shifts. Which statement must be true?",["Stella is a salesperson","Stella only works afternoon shifts","Jane works morning shifts","Stella is not a salesperson"],3,"Stella works morning (7-hour) shifts, and salespersons never do, so she is not a salesperson.","Logical Reasoning 2"],["Staff of the Foreign Relations unit work nights once a week. Jessica used to work nights once every week. Abby works for the Foreign Relations unit. Which must be true?",["Abby works nights once a week","Jessica works for the Foreign Relations unit","Abby used to work nights twice a week","Jessica still works nights every week"],0,"Abby is in the unit, so the unit rule applies to her. Nothing about Jessica is certain.","Logical Reasoning 2"],["Tim lives in a big apartment and Abby in a small one. Small apartments have one bedroom. There are no big apartments in Tinyville. Which must be true?",["Abby lives in Tinyville","Tim lives in Tinyville","Abby's apartment has one bedroom","Tim's apartment has two bedrooms"],2,"Small apartments have one bedroom. Tim can't live in Tinyville, and Abby's town isn't stated.","Logical Reasoning 2"],["Cleo is a good dog. Colonel is a bull. Bulls do not make noise. Good dogs are fast and keep the house safe. Which must be true?",["Colonel is fast","Cleo is fast","Cleo makes no noise","Colonel keeps the house safe"],1,"Good dogs are fast, and Cleo is a good dog.","Logical Reasoning 2"],["Onions have a strong smell. Strong smells do not bother David unless he is running a fever. Grains do not smell. Which must be true?",["Apples always smell","David is running a fever","Onions have grains","If an onion's smell bothers David, he is running a fever"],3,"Strong smells bother David only when he has a fever.","Logical Reasoning 2"],["Computer companies are always looking for new employees. Company A is a huge computer company. Company B is a huge food company. Which must be true?",["All computer companies are huge","Company A is looking for new employees","Company B is a small company","Company B is looking for new employees"],1,"Company A is a computer company, and computer companies are always hiring.","Logical Reasoning 2"],["Barbara has curly hair. Thomas has long legs. People with curly hair do not like wine. People with long legs either don't like wine or work in finance, never both. Which must be true?",["Barbara works in finance","Thomas works in finance","Barbara does not like wine","Thomas does not like wine"],2,"Curly-haired people don't like wine. Thomas could fit either side of his rule.","Logical Reasoning 2"],["John is a demon with pointed ears. Erica is not a princess. There are no demons without pointed ears. Princesses are always blonde and wear a crown. Which must be true?",["Every demon has pointed ears","Erica does not wear a crown","Erica is not blonde","Anyone with pointed ears is a demon"],0,"\"No demons without pointed ears\" means all demons have them. Not being a princess says nothing about Erica's hair or crown.","Logical Reasoning 2"],["Henrietta is Emma's daughter and Grace's mom. What is Emma to Grace?",["Her grandmother","Her mother","Her sister","Her aunt"],0,"Emma is the mother of Grace's mother.","Logical Reasoning 3"],["Dan is Joshua's son and Guy's brother. Margaret is Guy's mother and Judy's daughter. Which is definitely true?",["Joshua is Judy's son","Margaret is Joshua's sister","Dan is Judy's son","Judy is Guy's grandmother"],3,"Judy is the mother of Guy's mother, Margaret.","Logical Reasoning 3"],["John looked in the mirror and said, \"The father of the person I see in the mirror is Simon's brother.\" What is Simon to John?",["His son","His father","His brother","His uncle"],3,"John sees himself, so John's father is Simon's brother, which makes Simon his uncle.","Logical Reasoning 3"],["There are no dancers who aren't slim, and no singers who aren't dancers. Which is always true?",["All dancers are singers","All singers are slim","Some singers are not slim","All slim people are dancers"],1,"Every singer is a dancer, and every dancer is slim.","Logical Reasoning 3"],["All materials are degradable. Some materials are solid. Which is true?",["All solid things are degradable","Some degradable things are solid","All degradable things are materials","No solid things are degradable"],1,"The solid materials are also degradable.","Logical Reasoning 3"],["Some universal objects are invisible, and all universal objects are in space. Which is true?",["Some objects in space are invisible","All invisible objects are universal","No objects in space are invisible","All objects in space are invisible"],0,"The invisible universal objects must be in space.","Logical Reasoning 3"],["Danny found that 30% of Georgia's inhabitants are Indian, 50% work in the service industry, 20% in agriculture, and 60% drink Coke. Which must be true?",["At least 30% of Coke drinkers are Indian","At least 10% of inhabitants both work in the service industry and drink Coke","No farmer drinks Coke","Half of the Indians work in the service industry"],1,"50% + 60% = 110%, so at least 10% must be in both groups.","Logical Reasoning 3"],["All airplanes that don't stop in Spain fly to India. The first airplane didn't stop in Spain. Which is true?",["All airplanes fly to India","Airplanes that stop in Spain never fly to India","The first airplane flies to India","The first airplane stops in India and Spain"],2,"The rule applies directly to the first airplane.","Logical Reasoning 3"],["People who play instruments don't sing. All singers play instruments. Which must be true?",["Some instrument players sing","Some singers play instruments","There are no singers","All instrument players sing"],2,"A singer would have to play an instrument and therefore not sing, which is impossible. So no singers exist.","Logical Reasoning 3"],["Short basketball players don't exist. There are short football players. Which is true?",["No football players play basketball","All basketball players play football","Some short basketball players play football","Some football players don't play basketball"],3,"The short football players can't be basketball players.","Logical Reasoning 3"],["All birds with wings fly. There are black birds. Which is true?",["All flying things are birds","Black birds that have wings fly","All black birds fly","No black birds fly"],1,"Only birds with wings are certain to fly. Nothing says every black bird has wings.","Logical Reasoning 3"]]},{"s":"Deductive Reasoning","q":[["Rule: When property is sold through a vending machine, the owner of the property being sold is the retailer and owes sales tax on all gross receipts. John Conway sells his products through machines owned by Coin Flip Inc.; the products were made by Wine & Dine Co. Who owes the sales tax?",["John Conway","Coin Flip Inc. and Wine & Dine Co. equally","Wine & Dine Co.","Coin Flip Inc."],0,"The owner of the property being sold is the retailer. That is John Conway, not the machine owner or the manufacturer.","Deductive Reasoning 1"],["Severity ranks: Focal (one room, no peripheral damage), Peripheral (one room, with peripheral damage), Moderate (more than one room, up to 30%), High (more than one room, over 30%), Extreme (complete loss). A rubber-factory fire was contained to one room, but smoke destroyed stock in neighboring rooms (40% of the property). How severe is the fire?",["Focal","High","Peripheral","Moderate"],2,"The fire stayed in one room, and the smoke damage to neighboring rooms is peripheral damage.","Deductive Reasoning 1"],["Child abuse is defined as a recent act or failure to act by a parent or caretaker resulting in serious physical or emotional harm (or imminent risk of it). Which case best fits?",["Melissa spanked Donny, her 8-year-old son, for watching TV after hours","Sean forces his younger brother to steal candy for him","Rachel's babysitter enjoys making Rachel cry by convincing her that her parents hate her","Andrew did not forbid his child from trekking through South American jungles"],2,"A babysitter is a caretaker, and the act causes serious emotional harm. Sean is a brother, not a caretaker.","Deductive Reasoning 1"],["Under the Mental Health Security Officer rules, what must the officer do with a visitor who becomes abusive toward personnel?",["Escort the visitor out of the facility","Confiscate the visitor's card and let them stay","Restrain the visitor","Do nothing"],0,"Visitors who show abusive conduct, or are unauthorized, must be escorted out. Restraint applies to new patients.","Deductive Reasoning 2"],["Felony rules: F3 is 2–10 years in prison and a fine up to $10,000, and a crime is punished as F3 when a deadly weapon is used or exhibited. Vincent Bay robbed a wallet while threatening with a pocket knife. Which punishment is impossible for him?",["12 years in prison","10 years in prison","3 years in prison","A fine of $8,000"],0,"As an F3, the most prison time he can get is 10 years.","Deductive Reasoning 2"],["Colin Atwood was sentenced to 12 years in a state prison. Which felony degrees allow that sentence?",["Second Degree (F2) only","Third Degree (F3) or State Jail Felony (FS)","First Degree (F1) only","First Degree (F1) or Second Degree (F2)"],3,"F1 is 10–99 years and F2 is 5–25 years, so both include 12.","Deductive Reasoning 2"],["Hera Kay was fined $9,000 and confined for 6 years in a state prison. Which felony degrees fit?",["First Degree (F1) only","Second Degree (F2) or Third Degree (F3)","State Jail Felony (FS)","First Degree (F1) or Second Degree (F2)"],1,"6 years fits F2 (5–25) and F3 (2–10), and $9,000 is under both fine limits. F1 starts at 10 years.","Deductive Reasoning 2"],["Full time is 173 hours a month. Overtime pays 1.25× for the first 20 hours, 1.5× for hours 20–30, 1.75× for hours 30–40, and 2× above 40. Ron earns $10.00/hour and worked 215 hours. Which is true?",["He gets $20 per hour for all of his overtime hours","He gets $17.50 per hour for some of his overtime hours","He gets $17.50 per hour for all of his overtime hours","He gets $15.50 per hour for some of his overtime hours"],1,"215 − 173 = 42 overtime hours, which fall in several pay bands. Hours 30–40 pay 1.75 × $10 = $17.50.","Deductive Reasoning 2"],["Under the same overtime rule, what is the full-time monthly salary for an employee earning $10.00 per hour?",["$1,730","$2,162.50","$1,600","$1,750"],0,"Full-time salary = hourly wage × 173 hours.","Deductive Reasoning 2"],["Misdemeanor battery is unauthorized force causing harmful or offensive contact. Felony aggravated battery involves a deadly weapon, serious bodily harm, or a pregnant woman or police officer as victim. Which is the best example of misdemeanor battery?",["A police officer hit a man resisting arrest with her club","A man broke another man's jaw in a boxing tournament","A woman shoved a man down five stairs during an argument, causing minor bruising","A man hit another man with a stool in a bar fight, paralyzing him"],2,"Unlawful force causing only minor harm is misdemeanor battery. Paralysis is serious harm, and sanctioned boxing is authorized force.","Deductive Reasoning 2"],["Embezzlement: someone lawfully entrusted with assets takes them, has a legal or ethical relationship with the owner, and intends to deprive the owner permanently. Which is the best example?",["Rachel walks out of a dressing room wearing an unpaid shirt","Dave, a grocery-store cashier, takes $50 from the register","Amy, a waitress, keeps a $10 tip she must share","Howard, a car-rental manager, takes one of the cars for a week"],1,"Dave was entrusted with the register and took the money for good. Howard only borrowed the car, and Rachel was never entrusted with anything.","Deductive Reasoning 2"],["Which of these could be involved in a Class A fire?",["A power box","A wooden bookshelf","A can of paint thinner","An oxygen cylinder"],1,"Class A covers ordinary combustibles such as wood, fabrics and rubber.","Deductive Reasoning practice test 1"],["At a cardboard factory, several glue and paint cans caught fire. How should the fire be classified?",["Class C","Class D","Class B","Class A"],2,"Glue and paint are flammable liquids, which are Class B.","Deductive Reasoning practice test 1"],["Which sticker belongs on a storeroom rack holding computer screens and keyboards?",["A yellow decagon","A green triangle","A red square","A blue circle"],3,"Live electrical equipment is Class C, and its symbol is a blue circle.","Deductive Reasoning practice test 1"],["A safety specialist told a hotel kitchen that uses cooking oils and gas to install three water extinguishers and post \"Class B Fire Hazard\" signs. Were the instructions correct?",["No — he should have called for a different type of fire extinguisher","Yes — Class B fires are extinguished with water","No — an area needs a large amount of Class A material to be highly hazardous","Yes — combustible cooking material is involved in Class B fires"],0,"Class B fires are put out with dry chemicals or CO2, not water. Cooking media is a Class K hazard.","Deductive Reasoning practice test 1"],["Which location is NOT classified correctly?",["A meeting room classified as a light hazard area","A mall classified as an ordinary hazard area","An aircraft servicing garage classified as a light hazard area","A paint storage container classified as an extra hazard area"],2,"Hazard level depends on the amount and combustibility of materials. An aircraft garage holds large amounts of highly combustible material, so it is not light hazard.","Deductive Reasoning practice test 1"],["A computer in a classroom was burning, throwing sparks and small explosions, and Officer Martinez used carbon dioxide. Was that correct?",["No — only dry chemicals can be used on an electrical fire","Yes — Class C fires are extinguished using carbon dioxide","Yes — a burning computer is a Class A fire","No — a burning computer is a Class K fire"],1,"A burning computer is live electrical equipment (Class C), which needs a non-conducting agent such as CO2.","Deductive Reasoning practice test 1"],["A tire factory has extinguishers marked with a blue circle and a green triangle. Which hazards explain that choice?",["Lithium, potassium and cardboard","Gasoline tanks and compressed oxygen","Paint cans and generators","Heavy machinery and rubber"],3,"Blue circle is Class C (electrical machinery) and green triangle is Class A (rubber).","Deductive Reasoning practice test 1"],["A private house with wooden exterior walls is on fire. What is its construction type?",["Type 3","Type 5","Type 4","Type 2"],1,"Type 5 is wood frame, with combustible materials even in the exterior walls, as in private homes.","Deductive Reasoning practice test 1"],["A building has combustible furnishings but a non-combustible floor. Its construction type is most likely:",["Type 5","Type 4","Type 1 or 2","Type 2 or 3"],2,"Types 3–5 have combustible floors or framing. Types 1 and 2 are fire-resistive and non-combustible.","Deductive Reasoning practice test 1"],["A fire started at 17:30 on the top floor of a Type 2 building, and firefighters are on the roof. When is the latest they should be ordered off?",["18:30","18:00","Immediately","20:30"],0,"Type 2 construction gives 1 hour of roof protection, and 17:30 + 1 hour = 18:30.","Deductive Reasoning practice test 1"],["During a school fire alarm, teacher Charlie went back into the building to bring out a missing child before firefighters arrived. His actions were:",["Improper — he didn't follow the safety regulations for an alarm","Proper — he responded quickly and saved a child","Improper — he should have let the whole team decide","Proper — as a fire safety team member it is his responsibility"],0,"No one may re-enter until Public Safety or Fire Department personnel give clearance.","Deductive Reasoning practice test 1"],["Rose and Jessica tried to unplug and put out a burning computer, and sounded the alarm only once the flames grew. Were their actions proper?",["Yes — they acted according to regulations","No — they should have unplugged the computer at any cost","No — Rose used the wrong extinguisher","No — they should have sounded the alarm at first sight of the fire before trying to put it out"],3,"At the sign of flames, sound the alarm first. An ABC extinguisher is the right one for electrical fires.","Deductive Reasoning practice test 1"],["Chris saw smoke from a storage room. He called 911 with his name and location, sounded the alarm, and took the stairs to the parking lot. Was his conduct proper?",["No — he shouldn't have pulled the alarm","No — he should have tried to put the fire out","No — he should have stayed to wait for emergency services","Yes"],3,"He reported, alerted occupants and evacuated by the stairs, which matches the procedure.","Deductive Reasoning practice test 1"],["People trapped in thick smoke with no way to call for help should:",["Use the elevator to leave quickly","Stay low, feel doors for heat to find the safest path, and use the stairs","Use extinguishers on the fire, then find a way out","Call emergency services and wait"],1,"The procedures say stay low in smoke and never use elevators.","Deductive Reasoning practice test 1"],["Which is an unlikely (improbable) injury with high severity?",["Bob fractured his hand working heavy machinery at a construction site","A teacher sneezed and hit his head on his desk, causing brain trauma and internal bleeding","Amy got severe diarrhea from food poisoning","An off-duty officer was shot during a bank heist"],1,"A sneeze leading to brain trauma is improbable, and the injury is highly severe.","Deductive Reasoning practice test 1"],["Officer Smith returned to work after two days of rest with injuries not fully healed. What could NOT be true?",["He suffered severe fractures","His injuries happened in a likely scenario at medium risk","His injuries happened in an unlikely scenario","The risk level of his injuries was low"],0,"Severe fractures are high severity, which means more than three days of leave.","Deductive Reasoning practice test 1"],["Michael has painful red burns on his forearm, and only the outer layer of skin is damaged. What type of burn is it?",["Second-degree (partial thickness)","First-degree","Second-degree (full thickness)","Third-degree"],1,"A first-degree burn affects only the epidermis and is red and painful.","Deductive Reasoning practice test 2"],["Lidia gave intravenous antibiotics, with sterile technique, to a woman with blistered red burns on her legs and dry, charred burns on her back. Was this appropriate?",["No — she should have used only antibiotic cream","No — the victim still felt pain","Yes — intravenous antibiotics are used when the victim has charred burns","Yes — second-degree burns require intravenous antibiotics"],2,"Charred burns are third-degree, and their treatment includes IV antibiotics in a sterile environment.","Deductive Reasoning practice test 2"],["Amy's hot-water burns damaged only the epidermis, with no blistering, but are very painful. What best relieves her pain?",["Grafting","Cleaning of the wound","Ibuprofen","Antibiotic ointments"],2,"First-degree burn pain is treated with acetaminophen or ibuprofen.","Deductive Reasoning practice test 2"],["How long do very painful burns that look white and dry take to heal?",["Up to a week","10–21 days","Several months","21–35 days"],3,"White, dry, very painful burns are second-degree full thickness, which heal in 21–35 days.","Deductive Reasoning practice test 2"],["Which burn is NOT matched correctly to its class?",["A burn that took several weeks to heal — second-degree","A red burn that damaged the dermis — first-degree","A burn that heals in less than five days — first-degree","A burn that required a tetanus shot — third-degree"],1,"First-degree burns affect only the epidermis. Dermis damage means second-degree or worse.","Deductive Reasoning practice test 2"],["Larissa's palm burn damaged skin and muscle tissue but covers less than 10% of her body. The nurse says she must stay in the hospital. Is the nurse right?",["Yes — anyone given antibiotics must stay in the hospital","Yes — third-degree burns need emergency care in a sterile environment, not home care","No — it is a first-degree burn","No — burns covering 10% or less can be treated as an outpatient"],1,"Damage past the dermis is third-degree. The 10% outpatient rule applies only to second-degree burns.","Deductive Reasoning practice test 2"],["Why are third-degree burns NOT painful?",["They are always covered by blisters","They affect only the epidermis","They damage the nerves","They heal within a week"],2,"Third-degree burns are dry, white or charred, and painless because of nerve damage.","Deductive Reasoning practice test 2"],["Noah's firework set his backyard grass on fire. He put it out and no one was at risk, but sparks damaged his neighbor's laundry. Which type of arson is this?",["Fourth-degree arson","First-degree arson","Third-degree arson","Second-degree arson"],0,"Fourth degree is knowingly or recklessly creating a fire that endangers another person's property.","Deductive Reasoning practice test 2"],["Someone intentionally burns his own car to collect insurance money, endangering no one else. What class of charge applies?",["A Class 3 misdemeanor","A Class 2 misdemeanor","A Class 4 felony","A Class 3 felony"],2,"Third-degree arson (fire to defraud, such as for insurance) carries Class 4 felony penalties.","Deductive Reasoning practice test 2"],["A person intentionally burns a random parked vehicle he doesn't own. He may be charged with a:",["Class 2 or Class 3 misdemeanor","Class 4 felony or Class 3 misdemeanor","Class 4 felony or Class 2 misdemeanor","Class 3 felony or Class 2 misdemeanor"],2,"This is second-degree arson: a Class 4 felony if the property is worth more than $100, a Class 2 misdemeanor if less.","Deductive Reasoning practice test 2"],["A man set a convenience store's entrance on fire while workers were inside. They escaped, but the store burned down. Is this a Class 3 misdemeanor?",["Yes — he put someone else in danger","No — only property was damaged","No — the place was occupied","Yes — the structure is not a building"],2,"Burning someone else's occupied building is first-degree arson, a Class 3 felony.","Deductive Reasoning practice test 2"],["A man was convicted of first-degree arson for burning down an arena. Which fact may extend his prison time?",["He used explosives","The property is worth less than $100","He was trying to get insurance money","The property is worth more than $100"],0,"For first-degree arson, prison time may be extended if explosives were used.","Deductive Reasoning practice test 2"],["Substance Y's information gives no first aid details. Which MSDS section would be left empty?",["Preventive Measures","First Aid Measures","Reactivity Data","Product Information"],1,"Every other section can be filled from the data given; first aid is the only thing missing.","Deductive Reasoning practice test 2"],["A fire broke out on the bottom floor of an office building in a city's industrial area. Which appliance is most appropriate?",["A Hydraulic Platform","A Foam Tender","A Fire Engine","A Tanker Truck"],2,"It is a ground-level fire with city hydrants and no flammable liquids, so a conventional pump-and-hose engine fits.","Deductive Reasoning practice test 2"],["For which scenario is a Tanker Truck most suitable?",["An oil spill fire in a barn","An electrical fire in a computer company's storage room","A pile of tires burning on a city's main street","A large fire on a remote property on an extremely hot day"],3,"Tankers carry water where hydrants are unavailable, especially in rural or remote areas.","Deductive Reasoning practice test 2"]]},{"s":"Inductive Reasoning","q":[["How many fire apparatus does the New East Side Fire Department of Chicago have?",["30","40","24","15"],0,"The department has 30 apparatus, including 4 Water Tankers, 2 Wildland Fire Engines and 5 Aerial Apparatus.","Inductive Reasoning 1"],["At least how many apparatus must be operational, with adequate crews, at any time?",["10","30","15","20"],2,"At least 15 apparatus must be operational at any time.","Inductive Reasoning 1"],["What is the minimum crew for each fire engine?",["Two crew members","Five crew members","Three crew members","Four crew members"],2,"Each fire engine needs at least three crew members.","Inductive Reasoning 1"],["How many Aerial Apparatus must be fully operational at all times?",["At least 3","At least 5","At least 1","All 5"],0,"At least 3 Aerial Apparatus must be fully operational.","Inductive Reasoning 1"],["How are the department's 140 firefighters organized?",["In teams of at least 10, with at least three teams on call at any time","In teams of at least 10, with all teams on call","In teams of exactly 5, with two teams on call","In teams of at least 15, with one team on call"],0,"The tab gives teams of at least 10, at least three teams on call, across three daily shifts.","Inductive Reasoning 1"],["For the department's scheduling, when does the weekend run?",["Friday 6:00 pm to Monday 6:00 am","Friday 4:00 pm to Sunday 7:00 pm","Saturday 12:00 am to Sunday 11:59 pm","Friday 4:00 pm to Monday 7:00 am"],3,"The weekend is defined as Friday 4:00 pm to Monday 7:00 am.","Inductive Reasoning 1"],["In Johnny Boye's medical log key, what does event code 2 mean?",["A clinic visit","A clinic call","A specialist referral","A fracture"],1,"Event type 1 is a clinic visit and 2 is a clinic call.","Inductive Reasoning 1"],["In the same medical log key, which code means an ICU referral?",["4000","5000","100","50"],1,"4000 is a specialist referral and 5000 is an ICU referral.","Inductive Reasoning 1"],["In the medical log key, complaint code 50 stands for:",["A fracture","A viral infection","Muscular pain","A sore throat"],0,"Complaint codes: 50 = fracture, 80 = muscular pain, 20 = sore throat.","Inductive Reasoning 1"],["In the apartment-building fire, why did Witness 3 call 911?",["He was trapped by heavy smoke","He saw flames on the floor above","He smelled burning and saw smoke coming from the power box","His neighbor told him to"],2,"Witness 3 smelled burning, saw smoke from the power box, called 911 and warned his neighbors.","Inductive Reasoning 2"],["Based on the witness accounts, what most likely caused the apartment-building fire?",["A kitchen fire","Electrical failure","Hazardous materials","Arson"],1,"Witnesses describe electricity failures and smoke coming from the power box.","Inductive Reasoning 2"],["What happened to Witness 3 after he warned his neighbors?",["He helped firefighters rescue Gary","An explosion knocked him out and he woke up in an ambulance","He ran upstairs with Mark and Judy","He escaped through the emergency exit"],1,"Witness 3 says an explosion knocked him out and he woke in an ambulance.","Inductive Reasoning 2"],["In the witness accounts, who were Mark and Judy?",["The couple who called 911","Residents injured by smoke","A brother and sister who ran up floors to warn residents","Firefighters who rescued Gary"],2,"Witness 4 (Mark) and his sister Judy ran up floors to warn residents.","Inductive Reasoning 2"],["What was the total number of conference-room participants booked on Wednesday?",["575","315","500","525"],3,"100 + 150 + 75 + 200 = 525.","Inductive Reasoning 2"],["What share of Wednesday's 525 booked participants does 315 represent?",["60%","30%","6%","50%"],0,"315 ÷ 525 = 0.6, or 60%.","Inductive Reasoning 2"],["The pump-pressure table shows pump pressure (PSI) by which two factors?",["Water temperature and nozzle type","Building height and flow rate","Hose length and desired flow rate (GPM)","Number of firefighters and hose diameter"],2,"The table arranges pump pressure by hose length and desired flow rate in GPM for four handline types.","Inductive Reasoning 3"],["Which handline types appear in the pump-pressure table?",["1¾\" handlines only, with four nozzle types","1¾\" and 2\" handlines, each with a 100 PSI Fog Nozzle or a Smooth Bore","1½\" and 2½\" handlines with Fog Nozzles only","2\" and 3\" handlines with Smooth Bores only"],1,"The table lists 1¾\" and 2\" handlines with 100 PSI Fog Nozzle and Smooth Bore types.","Inductive Reasoning 3"],["In the office-supplies inventory, how many pencils come in a pack?",["10","3","24","12"],3,"Pencils come 12 per pack, black pens 3 per pack, and paper by the ream.","Inductive Reasoning 3"],["Which rule applies to ordering office supplies?",["Order only after a department runs out","Order enough to last the next quarter but nothing more, and packs can't be split between departments","Split packs evenly between departments","Order a full year of supplies at once"],1,"These are the inventory rules given in the setup.","Inductive Reasoning 3"],["Which category is NOT one of the six in the California fire-incident pie charts?",["Public buildings","Industrial areas","Vehicle fires","Wildfires"],2,"The categories are Residential, Assets and facilities, Public buildings, Office buildings, Industrial areas and Wildfires.","Inductive Reasoning 3"],["In the Route 30 tanker passage, what were the first missions of teams Alpha and Bravo?",["Alpha did extrication and rescue at the SUV; Bravo identified and prevented hazards at the tanker","Alpha extricated the car and Bravo evacuated the area","Both teams handled fire stabilization","Alpha evacuated the area and Bravo handled hazards"],0,"Alpha worked the burning SUV (fire control, medical care, extrication). Bravo positioned by the tanker and scanned for hazards.","Inductive Reasoning 4"],["What did team Bravo apply into the sewage system?",["Fluoroprotein foam concentrate","Water from a tanker truck","Sand to absorb the gasoline","Dry chemical powder"],0,"Team Bravo applied fluoroprotein foam concentrate into the sewage system.","Inductive Reasoning 4"],["What type of tanker was involved, and what was it carrying?",["A 7,200-gallon MC-331 tanker carrying propane","An 8,000-gallon tanker carrying diesel fuel","A 10,000-gallon MC-306 tanker carrying 8,000 gallons of gasoline","An 8,000-gallon MC-306 tanker carrying 7,200 gallons of gasoline"],3,"The passage describes an overturned 8,000-gallon MC-306 tanker carrying 7,200 gallons of gasoline.","Inductive Reasoning 4"],["After the tanker exploded, how far did the commander order the evacuation?",["1 mile","300 feet","100 meters","800 meters"],3,"He ordered an 800-meter evacuation and moved all apparatus 300+ ft. away.","Inductive Reasoning 4"],["Why was the incident commander criticized?",["He evacuated civilians to the wrong place","He did not take the explosion hazard into account in time","His teams worked slowly","He placed the apparatus dangerously"],1,"He was criticized for the late evacuation decision and praised for letting the fire burn out.","Inductive Reasoning 4"],["Why did the commander order the fire trucks moved?",["To let the ambulance reach the victims","To keep them a safe distance from the tanker","To get closer to the fire","To reach a hydrant"],1,"All apparatus were moved more than 300 ft. away from the tanker.","Inductive Reasoning 4"],["What is the best title for the Route 30 passage?",["Vehicle Incident Involving Tanker Hauling Gasoline","Hazardous Materials","Evacuation at an Accident Scene","Car Extrication from a Burning Vehicle"],0,"The passage covers the whole SUV–gasoline tanker incident, not just one part of it.","Inductive Reasoning 4"],["In the crash witnessed by Officer Hernandez's four witnesses, which car started the chain of collisions?",["A pickup truck that ran a red light","A speeding white Honda Civic that braked too late and rear-ended an Acura","A black SUV heading north","An Acura that sped up on a yellow light"],1,"All four witnesses describe a white Honda Civic speeding as the light turned yellow and rear-ending an Acura.","Inductive Reasoning 4"],["In the same crash, what happened to the motorcyclist?",["He crashed into the Acura's rear","He was thrown onto the sidewalk unhurt","The Acura hit him, he fell, and a pickup truck ran him over","The Honda Civic hit him directly"],2,"The Acura hit the motorcyclist, who fell and was run over by a pickup truck.","Inductive Reasoning 4"],["In the backyard-fire witness accounts, about when did the fire spread to the wood stack?",["6:15 PM","5:15 PM","About 5:45 PM","5:30 PM"],2,"The woman lit the leaves at 5:15, went inside at 5:30, and the fire spread at about 5:45.","Inductive Reasoning 4"]]},{"s":"Information Ordering","q":[["When rescuing a drowning person, what is the FIRST step?",["Alert others to call for help","Place your arm underneath the victim","Swim to the victim","Get a flotation device"],0,"The drowning-rescue order starts with alerting others, then getting a flotation device, then swimming to the victim.","Information Ordering 1"],["In the drowning rescue, what do you do right after swimming to the victim?",["Apply medical assistance","Alert others to call for help","Place the flotation device between yourself and the victim","Bring the victim to safety"],2,"After reaching the victim, place the flotation device between you, then put your arm under the victim.","Information Ordering 1"],["When approaching a crime scene, what is the first step?",["Capture the scene photographically","Record and collect evidence","Secure and protect the scene","Conduct a detailed search"],2,"The crime-scene order begins with securing and protecting the scene, then a preliminary survey.","Information Ordering 1"],["What is the LAST step when approaching a crime scene?",["Record and collect evidence","Initiate a preliminary survey","Prepare a narrative","Evaluate what physical evidence may be present"],0,"The order ends with a detailed search and then recording and collecting evidence.","Information Ordering 1"],["Officer Helena tells Gina, who is beating a man with a bat, to drop her weapon. Gina flees with the bat, neither surrendering nor attacking. What should Helena do?",["Call for backup","Holster her sidearm and wait","Shoot to stop","Handcuff Gina and report in"],0,"Under the Close Range Encounter rule, if the person neither surrenders nor attacks, call for backup.","Information Ordering 1"],["In the watchtower shift change, what does the outgoing officer do right after exiting the tower?",["Check the incoming officer's gear","Climb back up to confirm the change","Return to quarters immediately","Check his or her rifle chamber, then return to quarters"],3,"The outgoing officer makes sure the incoming officer has settled, exits, checks the rifle chamber, and only then returns to quarters.","Information Ordering 1"],["When taking fingerprints, what is the first step?",["Roll the finger onto the card","Have the subject wash hands thoroughly","Instruct the subject to look away","Have the subject fill in personal details"],1,"The order starts with washing hands, then making sure the fingers are free of lint.","Information Ordering 1"],["If an elderly person falls, what should you do first?",["Hold them by the hips and help them stand","Bring a chair close by","Move them into a kneeling position","Turn them and sit them on the chair"],1,"The sequence starts with bringing a chair close, then rolling the person onto their side with the upper leg bent.","Information Ordering 1"],["When storing toxic waste before off-site disposal, what comes right after determining which container is compatible?",["Rinse and dry the container","Store the container in a safe place","Identify the type of waste","Pour the waste in using a funnel"],0,"The order is identify the waste, choose a container, rinse and dry it, pour with a funnel, then store safely.","Information Ordering 1"],["If someone is choking, what comes right after hitting the victim between the shoulder blades?",["Position yourself in front of the victim","Call a trained medical professional","Thrust inwards and upwards into the victim's abdomen","Get the victim standing"],2,"Back blows with the heel of the hand come before abdominal thrusts, and calling a professional comes last.","Information Ordering 1"],["Under the Fire Emergency Plan, what does a security officer do FIRST on hearing an alarm or seeing a fire?",["Direct personnel to the emergency exits","Activate the fire alarm","Help anyone who can't escape","Go to the assigned evacuation spot"],1,"The rule says to activate the fire alarm first, then follow the evacuation procedure.","Information Ordering 1"],["What is the first step when destroying confidential documents?",["Record it in the Destruction Record","Get authorization from the Director of Archives and Records","Make sure the minimum retention time has passed","Shred and dispose of the document"],1,"The order begins with authorization and ends with shredding and disposal.","Information Ordering 2"],["What comes right before shredding a confidential document?",["Checking it isn't part of a lawsuit, investigation or audit","Making sure the retention time has passed","Recording it in the Destruction Record","Getting authorization"],2,"The document is recorded in the Destruction Record, then shredded and disposed of.","Information Ordering 2"],["For CPR on an unconscious person who isn't breathing, what is the first step?",["Interlock your fingers on the breastbone","Begin chest compressions","Move the victim onto his or her back","Send someone to call Emergency Medical Services"],3,"The CPR sequence starts by sending someone to call EMS.","Information Ordering 2"],["In the CPR steps, where is the heel of the first hand placed?",["On the breastbone, 2 finger widths above the lower ribs","On the stomach, below the navel","At the base of the throat","On the left side of the chest over the heart"],0,"Place the heel of one hand on the breastbone 2 finger widths above the lower ribs.","Information Ordering 2"],["During a mercury spill, what do you do right after putting on protective clothing?",["Sprinkle the area with chemical amalgam","Dispose of contaminated materials","Section off the area so the mercury can't spread","Wipe up the powder with a wet towel"],2,"Protective clothing comes first, then sectioning off the area, then the amalgam.","Information Ordering 2"],["By when must a county contact its designated Reception Center to arrange an inmate's delivery?",["By the first day of the month","By the Thursday before transfer week","By the Monday of transfer week","48 hours before delivery"],1,"The county contacts its Reception Center by the Thursday prior to transfer week.","Information Ordering 2"],["Officer Williams's Reception Center says it can't take any more inmates on the planned delivery day. What should he do?",["Wait until the following Thursday and call again","Deliver the inmate anyway","Hold the inmate at the county jail indefinitely","Contact the Intake Control Unit for an alternate Reception Center"],3,"If the Reception Center can't accept the inmate, the county contacts the Intake Control Unit for an alternate.","Information Ordering 2"],["When is a CGR 155 completed during prison intake?",["When the county first calls the Reception Center","When staff receive the inmate's cash and personal property","When medical clearance is issued","When the inmate is photographed"],1,"A CGR 155 is completed when staff receive the inmate's cash and personal property.","Information Ordering 2"],["In the inmate complaint procedure, how soon must the Prison Counselor issue a BP-9 form?",["Within 30 days","Within 20 days","Within 48 hours","Within 24 hours"],2,"The counselor issues the BP-9 within 48 hours, and the inmate completes it within 20 days of the incident.","Information Ordering 2"],["By how much may the Legal Office extend its response time limit, and what must it do first?",["Thirty days, after notifying the inmate","Forty-eight hours, without notice","Twenty days, after notifying the warden","Sixty days, after notifying C&R"],0,"The Legal Office may extend the time limit by thirty days after notifying the inmate.","Information Ordering 2"],["A woman is in an overturned car. Police have blocked traffic and stabilized the car, and Firefighter Josh entered through the door and deflated the airbag. What is his next step?",["Release her from her seatbelt","Remove the roof","Smash a window","Stabilize the vehicle with cribbing"],0,"The order is: release pressure and release seatbelts, then remove a door or roof, then remove victims.","Information Ordering 2"],["Firefighter Joe arrives at a burning car with smashed doors and windshield. What does the procedure say to do first?",["Remove the roof","Enter through the smashed windshield","Release the victims' seatbelts","Control the accident scene and divert traffic"],3,"The first step in the given order is controlling the scene and diverting traffic.","Information Ordering 2"],["When positioning a fire apparatus, what should the driver do right after evaluating the incident?",["Slow down and look at three sides of the incident","Chock the wheels and place traffic cones","Prepare to connect to the water supply","Drive toward the preferred attack position, watching for hazards such as spilled fluids and fallen power lines"],3,"After evaluating the attack position, the driver moves toward it while watching for hazards.","Information Ordering 3"],["How far should the apparatus be positioned from the fire area?",["100 ft away, regardless of hydrants","30 ft away, but close enough to a hydrant","Directly in front of the fire area","10 ft away, right next to the entrance"],1,"The apparatus goes 30 ft from the fire area but close enough to a hydrant.","Information Ordering 3"],["What does the driver do right BEFORE preparing to connect to the water supply or sprinkler?",["Evaluate the incident","Set the park brake, chock the wheels and place traffic cones","Look at three sides of the incident","Drive toward the preferred attack position"],1,"Parking and securing the apparatus comes just before staying with it to make connections.","Information Ordering 3"],["What is the first step of a window entry for ventilation and search?",["Get permission from the incident commander","Clear the window of glass","Sound the floor","Put on full personal protective equipment"],0,"Permission comes first, and only then do you put on full PPE.","Information Ordering 3"],["During a window entry, what do you do right after sounding the floor to confirm it can hold your weight?",["Clear the window of glass","Enter the room and locate the door","Check the hallway for fire conditions","Place the portable ladder on the sill"],1,"Sound the floor, enter and find the door, then check the hallway.","Information Ordering 3"],["At a motor vehicle accident with trapped victims, what must the first arriving officer do immediately?",["Cut the Nader pin","Cover the victim with a blanket","Notify the dispatcher","Remove the door"],2,"The officer must immediately notify the dispatcher, then check under the vehicle before any stabilization.","Information Ordering 3"],["Which of the MVA actions is carried out LAST?",["Checking under the vehicle for victims","Stabilizing the vehicle","Removing the door","Cutting the Nader pin off the door"],2,"The door is removed only after the Nader pin is cut.","Information Ordering 3"],["Before which action must you check under the vehicle for victims?",["Notifying the dispatcher","Arriving at the scene","Calling for a tow truck","Any stabilization of the vehicle"],3,"Check under the vehicle for victims before any stabilization.","Information Ordering 3"],["When dealing with a man threatening suicide, what do you do right after securing the scene?",["Take control unobtrusively","Approach, introduce yourself and your organization, and ask what he likes to be called","Assess him for medical treatment","Reassure him that he did the right thing"],1,"Securing the scene is followed by the approach and introduction.","Information Ordering 4"],["What is the LAST step with a suicide attempter?",["Keep an active conversation going","After the crisis, reassure him and tell him he did the right thing","Listen carefully and speak calmly","Assess the person for medical treatment"],1,"Reassurance comes after the crisis is over.","Information Ordering 4"],["Under the bomb-threat procedure, which step comes right after gathering information from people at the scene?",["Locate and evaluate where the incident occurred","Prevent civilians from entering the scene","Search and evacuate","Reevaluate the incident"],2,"The order is locate and evaluate, gather information, search and evacuate, prevent entry, reevaluate.","Information Ordering 4"],["In the RECEO VS sequence, what is always the first priority?",["Rescue","Exposure","Ventilate","Extinguish"],0,"Rescue is always first, and exposures are second.","Information Ordering 4"],["What should an incident commander prioritize immediately AFTER rescuing victims?",["Ventilation","Salvage","Exposures","Overhaul"],2,"After rescue (R), exposures (E) come second.","Information Ordering 4"],["In the RECEO VS sequence, what comes LAST?",["Confine","Overhaul","Salvage (property conservation)","Extinguish"],2,"Salvage and property conservation come last.","Information Ordering 4"],["What are the fire service's three objectives in the passage?",["Rescue, extinguish and investigate","Prevention, education and enforcement","Saving lives, conserving property and protecting the environment","Speed, safety and cost"],2,"The passage lists saving lives, conserving property and protecting the environment.","Information Ordering 4"],["In the witness's car-accident account, what did the speeding car hit?",["A white van driving east","The witness's car","A pedestrian at the crosswalk","A police car"],0,"The speeding car ran the red light and hit a white van driving east.","Information Ordering 4"],["What happened right before the police arrived and arrested the driver who caused the accident?",["The witness noticed full-beam headlights in his mirror","An ambulance arrived and paramedics cared for the victims","The speeding car crossed on a red light","The witness stopped at the red light"],1,"The ambulance arrived 5 minutes after the crash, and the police came after that.","Information Ordering 4"]]},{"s":"Problem Sensitivity","q":[["A correctional officer whose life is not threatened may shoot a violent inmate only with a .22 caliber rimfire using rubber, sand or rock-salt ammunition. Which officer violated this rule?",["Officer Buckley, who used a .22 rimfire handgun with .22 Short ammunition on an inmate not threatening his life","Officer Morris, who used rock-salt ammunition on an inmate who threatened him","Officer Thompson, who used a .22 rimfire rifle with rock-salt ammunition on an inmate beating another inmate","Officer Kelly, who used a .22 rimfire rifle with .22 sand ammunition"],0,".22 Short is not rubber, sand or rock-salt ammunition.","Problem Sensitivity 1"],["An ingredient in Black Fog perfume gave dogs severe rashes, and the makers printed no warning. Under the cosmetics rule:",["They did not violate the rule if safety was substantiated before the reports","They violated the rule only by not recalling the perfume","They would have violated the rule by not printing a warning, even if the ingredient's safety had been adequately substantiated before","They would not have violated the rule even without prior substantiation"],2,"A warning can be skipped only if the new information shows no health hazard. Here it does show one, so a warning was required.","Problem Sensitivity 1"],["Workers over 18 who work more than 6 hours a day get one uninterrupted break of at least how long?",["10 minutes","45 minutes","20 minutes","30 minutes"],2,"The rule gives one uninterrupted rest break of at least 20 minutes.","Problem Sensitivity 1"],["How much daily rest must there be between working days?",["At least 11 hours","At least 10 hours","At least 8 hours","At least 12 hours"],0,"Daily rest is at least 11 hours between working days. The working day itself is capped at 10 hours.","Problem Sensitivity 1"],["Alice works Monday 5:00 PM–10:00 PM, then Tuesday through Friday 6:00 AM–1:00 PM. Why does her schedule violate the rest-break rule?",["She gets only 8 hours of rest between Monday night and Tuesday morning","She works four days in a row","She works more than 10 hours on Monday","She works fewer than 6 hours on Monday"],0,"10:00 PM to 6:00 AM is 8 hours, short of the 11-hour daily rest.","Problem Sensitivity 1"],["Tom shone a flashlight on a raccoon that had climbed a tree and shot it with a .17 caliber centerfire handgun. How did he break the raccoon rule?",["He shouldn't have shot the raccoon at all","He should have been on foot","He shouldn't have shone a flashlight on it","He shot it with the wrong type of gun"],3,"Handguns must be .17 or .22 caliber rimfire, and his was centerfire.","Problem Sensitivity 1"],["On November 5, Andy asked for 6 days of leave starting November 15. The hotel refused on November 7. Which violation occurred?",["The hotel's refusal violated the rule","Andy's request violated the rule","Both the request and the refusal violated the rule","Neither violated the rule"],1,"Notice must be twice the leave (12 days), and Andy gave 10. The refusal came 8 days ahead, which meets the 6 days the employer needs.","Problem Sensitivity 1"
